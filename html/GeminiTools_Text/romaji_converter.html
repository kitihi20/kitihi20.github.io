<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローマ字 → 日本語 変換ツール</title>
    <!--<script src="https://cdn.tailwindcss.com"></script>-->
    <!--<script src="/js/tailwindcss_4_2_1.js"></script>-->
    <script src="/js/tailwindcss_3_4_17.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#121212',
                            panel: '#1e1e1e',
                            border: '#333333',
                            input: '#2d2d2d',
                            text: '#e0e0e0',
                            muted: '#9e9e9e',
                            primary: '#3b82f6',
                            primaryHover: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        /* テキストエリアのアウトライン削除 */
        textarea:focus {
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans p-4 md:p-6 lg:h-screen lg:overflow-hidden">

    <!-- ヘッダー -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
            </svg>
            <h1 class="text-2xl font-bold tracking-wider text-white">Romaji <span class="text-blue-500">→</span> 日本語</h1>
        </div>
        
        <!-- ステータスバッジ -->
        <div id="statusBadge" class="px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-700 text-gray-300 flex items-center gap-2 transition-colors duration-300">
            <div id="statusDot" class="w-2 h-2 rounded-full bg-gray-400"></div>
            <span id="statusText">待機中</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
        
        <!-- 左側：設定パネル -->
        <aside class="w-full lg:w-1/3 xl:w-1/4 bg-dark-panel border border-dark-border rounded-xl shadow-2xl p-5 flex flex-col gap-5 overflow-y-auto">
            <div class="border-b border-dark-border pb-3">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    API 設定
                </h2>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-dark-muted mb-1">API エンドポイントURL</label>
                    <input type="text" id="apiUrl" value="http://localhost:1234/v1/chat/completions" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-sm text-white focus:border-blue-500 transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm text-dark-muted mb-1">モデル名 (Model)</label>
                    <input type="text" id="modelName" value="google/gemma-4-e4b" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-sm text-white focus:border-blue-500 transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm text-dark-muted mb-1">API Key (通常は不要/ダミー)</label>
                    <input type="password" id="apiKey" value="" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-sm text-white focus:border-blue-500 transition-colors">
                </div>

                <div>
                    <label class="block text-sm text-dark-muted mb-1">システムプロンプト</label>
                    <textarea id="sysPrompt" rows="5" class="w-full bg-dark-input border border-dark-border rounded-lg p-2.5 text-sm text-white focus:border-blue-500 transition-colors resize-y">入力された漢字が無い文を、漢字がある文章に変換してください。
思考プロセス、解説、前置きなどは一切含めず、変換結果のテキストのみを直接出力してください。</textarea>
                </div>
            </div>

            <div class="mt-auto pt-4 border-t border-dark-border">
                <div class="bg-blue-900/20 border border-blue-800/50 rounded-lg p-3 text-xs text-blue-200">
                    <ul class="list-disc pl-4 space-y-1">
                        <li>入力変更時に自動送信されます。</li>
                        <li><strong>送信後5秒間</strong>はクールダウンとして再送信しません。</li>
                        <li><strong>通信中</strong>は次のリクエストをブロックします。</li>
                        <li>思考出力(&lt;think&gt;)は自動除去されます。</li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- 右側：入出力エリア -->
        <section class="w-full lg:w-2/3 xl:w-3/4 flex flex-col gap-6 min-h-[600px] lg:min-h-0">
            
            <!-- ローマ字入力 -->
            <div class="flex-1 flex flex-col bg-dark-panel border border-dark-border rounded-xl shadow-2xl overflow-hidden min-h-[250px]">
                <div class="bg-dark-input px-4 py-3 border-b border-dark-border flex justify-between items-center">
                    <span class="text-sm font-semibold text-dark-muted uppercase tracking-wider">入力</span>
                    <button id="clearBtn" class="text-xs bg-dark-border hover:bg-gray-600 text-white px-3 py-1.5 rounded transition-colors flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        クリア
                    </button>
                </div>
                <textarea id="inputText" class="flex-1 w-full bg-transparent p-5 text-white text-lg resize-none" placeholder="そらからながれおちるみずばしらとともにかいゆうするのは..."></textarea>
            </div>

            <!-- 日本語出力 -->
            <div class="flex-1 flex flex-col bg-dark-panel border border-dark-border rounded-xl shadow-2xl overflow-hidden min-h-[250px]">
                <div class="bg-dark-input px-4 py-3 border-b border-dark-border flex justify-between items-center">
                    <span class="text-sm font-semibold text-dark-muted uppercase tracking-wider">変換結果</span>
                    <button id="copyBtn" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded transition-colors flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        コピー
                    </button>
                </div>
                <div id="outputText" class="flex-1 w-full bg-transparent p-5 text-white text-lg overflow-y-auto whitespace-pre-wrap leading-relaxed"></div>
            </div>

        </section>
    </main>

    <!-- JavaScript ロジック -->
    <script>
        // DOM要素の取得
        const els = {
            apiUrl: document.getElementById('apiUrl'),
            modelName: document.getElementById('modelName'),
            apiKey: document.getElementById('apiKey'),
            sysPrompt: document.getElementById('sysPrompt'),
            inputText: document.getElementById('inputText'),
            outputText: document.getElementById('outputText'),
            statusBadge: document.getElementById('statusBadge'),
            statusText: document.getElementById('statusText'),
            statusDot: document.getElementById('statusDot'),
            clearBtn: document.getElementById('clearBtn'),
            copyBtn: document.getElementById('copyBtn'),
        };

        // 状態管理変数
        let pendingText = "";
        let lastSentText = "";
        let lastSendTime = 0;
        let isRequesting = false;
        const COOLDOWN_MS = 5000; // 5秒のクールダウン

        // ステータスUIの更新関数
        function updateStatus(state, details = "") {
            switch(state) {
                case 'idle':
                    els.statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-gray-700 text-gray-300 flex items-center gap-2';
                    els.statusDot.className = 'w-2 h-2 rounded-full bg-gray-400';
                    els.statusText.textContent = '待機中';
                    break;
                case 'requesting':
                    els.statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-blue-900 text-blue-300 flex items-center gap-2 border border-blue-700';
                    els.statusDot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-pulse';
                    els.statusText.textContent = 'API通信中...';
                    break;
                case 'cooldown':
                    els.statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-yellow-900 text-yellow-300 flex items-center gap-2 border border-yellow-700';
                    els.statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500';
                    els.statusText.textContent = `クールダウン中 ${details}`;
                    break;
                case 'error':
                    els.statusBadge.className = 'px-4 py-1.5 rounded-full text-sm font-semibold bg-red-900 text-red-300 flex items-center gap-2 border border-red-700';
                    els.statusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                    els.statusText.textContent = 'エラー発生';
                    break;
            }
        }

        // 入力イベントリスナー：変数を更新するのみ（送信はループで監視）
        els.inputText.addEventListener('input', () => {
            pendingText = els.inputText.value;
        });

        // テキストクリア
        els.clearBtn.addEventListener('click', () => {
            els.inputText.value = "";
            pendingText = "";
            els.inputText.focus();
        });

        // 結果コピー
        els.copyBtn.addEventListener('click', () => {
            const textToCopy = els.outputText.textContent;
            if (textToCopy) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = els.copyBtn.innerHTML;
                    els.copyBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> コピーしました';
                    els.copyBtn.classList.replace('bg-blue-600', 'bg-green-600');
                    setTimeout(() => {
                        els.copyBtn.innerHTML = originalText;
                        els.copyBtn.classList.replace('bg-green-600', 'bg-blue-600');
                    }, 2000);
                });
            }
        });

        // 状態監視・送信制御ループ (100msごとにチェック)
        setInterval(() => {
            const currentText = pendingText.trim();

            // 1. テキストが空の場合
            if (!currentText) {
                if (els.outputText.textContent !== "") {
                    els.outputText.textContent = "";
                }
                lastSentText = ""; // リセット
                if (!isRequesting) updateStatus('idle');
                return;
            }

            // 2. テキストに変更がない場合
            if (currentText === lastSentText) {
                if (!isRequesting) updateStatus('idle');
                return;
            }

            // 3. 以前のリクエストが通信中の場合（排他制御）
            if (isRequesting) {
                updateStatus('requesting');
                return;
            }

            // 4. クールダウンの判定（一度送信したら5秒間は送信しない）
            const now = Date.now();
            const timeSinceLastSend = now - lastSendTime;
            
            if (timeSinceLastSend < COOLDOWN_MS) {
                const remainingSec = ((COOLDOWN_MS - timeSinceLastSend) / 1000).toFixed(1);
                updateStatus('cooldown', `(${remainingSec}s)`);
                return;
            }

            // 全条件クリア：APIリクエスト実行
            sendToAPI(currentText);

        }, 100);

        // API通信処理
        async function sendToAPI(textToSend) {
            isRequesting = true;
            lastSentText = textToSend;
            lastSendTime = Date.now(); // 送信開始時刻を記録
            updateStatus('requesting');

            // APIパラメータの準備
            //reasoning_effort: "low",
            const payload = {
                model: els.modelName.value,
                messages: [
                    { role: "system", content: els.sysPrompt.value },
                    { role: "user", content: textToSend }
                ],
                temperature: 0.3, // 変換タスクのため低めに設定（安定化・高速化）
                max_tokens: 4096
            };

            // ヘッダーの動的構築 (APIキーが空ならAuthorizationを送らない)
            const headers = {
                'Content-Type': 'application/json'
            };
            if (els.apiKey.value.trim() !== '') {
                headers['Authorization'] = `Bearer ${els.apiKey.value.trim()}`;
            }

            try {
                const response = await fetch(els.apiUrl.value, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    let result = data.choices[0].message.content;
                    
                    // 推論モデル(DeepSeek R1等)の <think> タグを除去する処理
                    result = result.replace(/<think>[\s\S]*?<\/think>/gi, '');
                    
                    // 前後の空白や余計な改行をトリムして表示
                    els.outputText.textContent = result.trim();
                } else {
                    throw new Error("APIからのレスポンス形式が不正です。");
                }

            } catch (error) {
                console.error("API Error:", error);
                els.outputText.textContent = `[通信エラー]\n${error.message}\n\n※ローカルAPI (LM Studio等) が起動しており、CORS設定が許可されているか確認してください。\n※LM Studioのサーバー設定で「CORS」をONにする必要があります。`;
                updateStatus('error');
            } finally {
                isRequesting = false;
                // ※通信終了時に lastSendTime を更新したい場合はここに記述しますが、
                // 要件「一度送信したら5秒間は…」に則り、送信開始時を基準にしています。
            }
        }
    </script>
</body>
</html>
