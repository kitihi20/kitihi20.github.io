    <style>
        :root {
            /* グリッドパラメータ */
            --cols: 12;
            --gutter: 24px;
            --margin: 48px;
            --max-width: 1440px;
            
            /* 垂直リズムパラメータ */
            --baseline: 8px;
            --leading: 24px; /* baseline * 3 */

            /* カラーパレット */
            --color-paper: #ffffff; /* ピュアホワイト */
            --color-ink: #111111;   /* ニアブラック */
            --color-accent: #e4002b; /* 赤 */
            --color-muted: #666666;
            --color-border: #cccccc;

            /* タイポグラフィ */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        /* -------------------------------------
           リセットと基本設定
           ------------------------------------- */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-paper);
            color: var(--color-ink);
            font-family: var(--font-sans);
            font-size: 16px; 
            line-height: var(--leading); /* 4. 垂直リズムのロック */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, p, ul, a { margin: 0; padding: 0; font-weight: normal; }
        ul { list-style: none; }
        a { color: inherit; text-decoration: none; }

        /* -------------------------------------
           タイポグラフィの階層と垂直リズム
           ------------------------------------- */
        h1 {
            font-size: 64px;
            font-weight: 700;
            line-height: 72px; /* baseline * 9 */
            margin-bottom: 24px; /* baseline * 3 */
            letter-spacing: -0.02em;
        }
        h2 {
            font-size: 32px;
            font-weight: 700;
            line-height: 48px; /* baseline * 6 */
            margin-top: 72px;  /* baseline * 9 */
            margin-bottom: 24px;
            letter-spacing: -0.01em;
            border-top: 2px solid var(--color-ink);
            padding-top: 6px; /* 境界線の2pxと合わせて8px(ベースライン)を消費 */
        }
        p.desc {
            font-size: 24px;
            line-height: 32px; /* baseline * 4 */
            color: var(--color-muted);
            margin-bottom: 48px; /* baseline * 6 */
        }
        
        .mono { 
            font-family: var(--font-mono); 
            font-size: 14px; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            color: var(--color-accent);
        }

        /* -------------------------------------
           グリッドレイアウト構造
           ------------------------------------- */
        /* 2. オーバーレイとコンテンツの同一コンテナ配置 */
        .wrap {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 96px var(--margin); /* 上下余白もベースラインの倍数 */
            position: relative; /* ガイド線の基準点 */
        }

        /* 3. Subgridによるカラムラインでのスナップ */
        .grid {
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            column-gap: var(--gutter);
        }

        .subgrid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: subgrid;
        }

        /* 要素の配置ユーティリティ (左揃え・右ラグを形成) */
        .col-1-8 { grid-column: 1 / 9; }
        .col-1-12 { grid-column: 1 / 13; }

        /* -------------------------------------
           コンポーネント: Quick Applications (Icon Grid)
           ------------------------------------- */
        .tool-grid {
            margin-bottom: 48px;
        }
        .tool-item-card {
            grid-column: span 3; /* 12カラム中3カラム = 4列配置 */
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--color-border);
            padding-top: 15px; /* border1px + padding15px = 16px (baseline*2) */
            margin-bottom: 48px;
            height: 120px; /* 垂直リズムの維持 */
            transition: color 0.1s ease, border-color 0.1s ease;
        }
        .tool-item-card:hover {
            color: var(--color-accent);
            border-top-color: var(--color-accent);
        }
        .tool-item-single {
            grid-column: span 1;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--color-border);
            padding-top: 4px;
            margin-bottom: 16px;
            height: 56px;
            transition: color 0.1s ease, border-color 0.1s ease;
        }
        .tool-item-single:hover {
            color: var(--color-accent);
            border-top-color: var(--color-accent);
        }
        .tool-icon {
            font-size: 32px;
            line-height: 32px;
            margin-bottom: 16px;
        }
        .tool-name {
            font-weight: 500;
            font-size: 16px;
            line-height: 24px;
        }

        /* -------------------------------------
           コンポーネント: List Tools (Row Style)
           ------------------------------------- */
        .tool-list-container {
            border-top: 1px solid var(--color-ink);
        }
        .tool-list-row {
            display: grid;
            grid-template-columns: subgrid;
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--color-border);
            padding: 23px 0; /* padding上下23px + border1px*2 = 48px (baseline*6) の行高 */
            align-items: baseline;
            transition: color 0.1s ease;
        }
        .tool-list-row:hover {
            color: var(--color-accent);
        }
        .list-title {
            grid-column: 1 / 4;
            font-weight: 500;
            font-size: 24px;
            line-height: 32px;
        }
        .list-desc {
            grid-column: 4 / 11;
            color: var(--color-muted);
            font-size: 16px;
            line-height: var(--leading);
        }
        .list-arrow {
            grid-column: 12 / 13;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 24px;
        }

        /* -------------------------------------
           5. グリッドの可視化レイヤー
           ------------------------------------- */
        .grid-overlay {
            position: absolute;
            top: 0; bottom: 0; left: var(--margin); right: var(--margin);
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            column-gap: var(--gutter);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 9999;
        }
        .grid-overlay-col {
            background-color: rgba(228, 0, 43, 0.03);
            height: 100%;
            border-left: 1px solid rgba(228, 0, 43, 0.15);
            border-right: 1px solid rgba(228, 0, 43, 0.15);
        }
        .grid-overlay-baseline {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 100% var(--baseline);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 9998;
        }
        .show-grid .grid-overlay,
        .show-grid .grid-overlay-baseline {
            opacity: 1;
        }
        .guide-status {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--color-ink);
            color: var(--color-paper);
            padding: 8px 16px;
            font-size: 12px;
            font-family: var(--font-mono);
            z-index: 10000;
        }

        /* -------------------------------------
            動的リスト用UIコンポーネント (タグ・フィルター用)
            ------------------------------------- */
        .filter-container {
            grid-column: 1 / -1;
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-tag {
            grid-column: span 2;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--color-border);
            padding-top: 4px;
            margin-bottom: 16px;
            height: 56px;
            transition: color 0.1s ease, border-color 0.1s ease;
        }
        .filter-tag.active {
            border-color: var(--color-accent);
            color: var(--color-accent);
            font-weight: 500;
        }
        .tool-tag-list {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .tool-tag {
            font-size: 12px;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--color-muted);
        }

        /* -------------------------------------
           レスポンシブ対応
           ------------------------------------- */
        @media (max-width: 1024px) {
            .tool-item-card { grid-column: span 4; } /* 3列配置に変更 */
        }
        @media (max-width: 768px) {
            :root { --margin: 24px; --gutter: 16px; }
            h1 { font-size: 40px; line-height: 48px; }
            h2 { font-size: 24px; line-height: 32px; }
            .col-1-8 { grid-column: 1 / -1; }
            .tool-item-card { grid-column: span 6; height: auto; padding-bottom: 24px; }
            .list-title { grid-column: 1 / -1; margin-bottom: 8px; }
            .list-desc { grid-column: 1 / -1; }
            .list-arrow { display: none; }
        }
        @media (max-width: 500px) {
            .tool-item-single { grid-column: span 2; }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ========================================================
               5. グリッドの可視化とトグル機能
               ======================================================== */
            const gridOverlay = document.getElementById('gridOverlay');
            const rootStyles = getComputedStyle(document.documentElement);
            const cols = parseInt(rootStyles.getPropertyValue('--cols').trim(), 10) || 12;

            // CSS変数から取得したカラム数分、オーバーレイのDOMを生成
            for (let i = 0; i < cols; i++) {
                const col = document.createElement('div');
                col.className = 'grid-overlay-col';
                gridOverlay.appendChild(col);
            }

            // 'G'キー押下で body に .show-grid クラスをトグル
            document.addEventListener('keydown', (e) => {
                // 入力フォームでの入力時は無視する
                if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
                
                if (e.key === 'g' || e.key === 'G') {
                    document.body.classList.toggle('show-grid');
                }
            });

            /* ========================================================
               6. 視覚的配置調整（Optical Alignment）
               見出しの左サイドベアリング（インクの余白）を相殺し、
               厳密にカラムの開始線に文字をスナップさせる。
               ======================================================== */
            const alignOptically = () => {
                const elements = document.querySelectorAll('.optical-align');
                if (!elements.length) return;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                elements.forEach(el => {
                    // 要素のスタイルをリセット
                    el.style.marginLeft = '0px';

                    const style = window.getComputedStyle(el);
                    ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
                    const text = el.innerText || el.textContent;
                    
                    // measureTextを使用して実際の描画領域を計算
                    const metrics = ctx.measureText(text);
                    const leftInk = metrics.actualBoundingBoxLeft;
                    
                    // インクの左端が基準点より右にある場合、ネガティブマージンで左に引っ張る
                    if (leftInk > 0 && leftInk < 15) {
                         el.style.marginLeft = `-${leftInk}px`;
                    }
                });
            };

            // Webフォント読み込み完了後に配置を調整
            document.fonts.ready.then(alignOptically);

            // ウィンドウリサイズ時（フォントサイズ変更時）に再計算
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(alignOptically, 200);
            });
        });

        { title: 'Browser & Web API Tester', url: '/html/GeminiToys/Browser&WebAPI_Test.html', desc: 'ブラウザを使ったギミックまとめ。何かのネタになるかも。', tags: ['Web', 'Dev'] },
        { title: 'History API Maze', url: '/html/GeminiToys/HistoryAPI_Maze.html', desc: 'ブラウザの戻るで戻れる迷路。何かのネタになるかも。', tags: ['Web', 'Game'] },
        { title: 'NFC Reader', url: '/html/GeminiTools/NFCReader.html', desc: 'NFCカードの固有IDを読み取る。一部Androidのみ利用可。', tags: ['System', 'Utility'] },
        { title: '3D Tube Shooter', url: '/html/GeminiToys/3DTubeShooter.html', desc: '画面奥から迫りくる敵を撃退するゲーム。あるゲームを形だけ再現したもの。', tags: ['Game'] }
        ];

        let currentFilter = 'All';

        const listContainer = document.getElementById('dynamic-tool-list');
        const filterContainer = document.getElementById('filter-container');

        function renderTools() {
            listContainer.innerHTML = '';
            
            // 現在のフィルターに合致するツールを抽出
            const filteredTools = currentFilter === 'All' 
                ? toolsData 
                : toolsData.filter(t => t.tags.includes(currentFilter));

            // リストのDOM生成 (行全体をaタグでラップし、元のホバー効果を維持)
            filteredTools.forEach(tool => {
                const row = document.createElement('a');
                row.href = tool.url;
                row.className = 'tool-list-row';
                row.innerHTML = `
                    <div class="list-title">
                        ${tool.title}
                        <div class="tool-tag-list">
                            ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="list-desc">${tool.desc}</div>
                    <div class="list-arrow">▶&nbsp;</div>
                `;
                listContainer.appendChild(row);
            });
        }

        function renderFilters() {
            filterContainer.innerHTML = '';
            
            // 現在のデータからユニークなタグを抽出
            const allTags = new Set();
            toolsData.forEach(tool => tool.tags.forEach(tag => allTags.add(tag)));
            
            // 'All' を先頭にしてアルファベット順にソート
            const tagsArray = ['All', ...Array.from(allTags)].sort();

            // タグボタンの生成
            tagsArray.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-tag ${tag === currentFilter ? 'active' : ''}`;
                btn.textContent = tag;
                
                btn.addEventListener('click', () => {
                    currentFilter = tag;
                    renderFilters(); // activeクラスの付け替えのために再描画
                    renderTools();   // リストの絞り込み
                });
                
                filterContainer.appendChild(btn);
            });
        }

        // 初期描画の実行
        renderFilters();
        renderTools();
    </script>
</body>
