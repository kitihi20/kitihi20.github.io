<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Minimal Markdown Viewer</title>
  
  <!-- 必須のパーサーライブラリ（これ1つのみ） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 見た目も気にするならここら辺もいる -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <style>
    .markdown-body {
      /*max-width: 800px;*/
      margin: 40px auto;
      padding: 0 20px;
    }
  </style>

</head>

<body>

  <div id="content" class="markdown-body">読み込み中...</div>

  <script>
    fetch('Unity6_UPR_Horror_Environment_Guide.md')
      .then(response => response.text())
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      });
  </script>

</body>

</html>
