<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マルチタイマーアプリ</title>
    <!--<script src="https://cdn.tailwindcss.com"></script>-->
    <!--<script src="/js/tailwindcss_4_2_1.js"></script>-->
    <script src="/js/tailwindcss_3_4_17.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --alert-color: #ef4444;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: #f1f5f9;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        input[type="range"] {
            accent-color: #6366f1; /* indigo-500 */
        }

        @keyframes flashAlert {
            0% { 
                border-color: rgba(239, 68, 68, 0.3); 
                box-shadow: 0 0 10px rgba(239, 68, 68, 0.2) inset; 
            }
            50% { 
                border-color: var(--alert-color); 
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.6) inset, 0 0 10px rgba(239, 68, 68, 0.4); 
            }
            100% { 
                border-color: rgba(239, 68, 68, 0.3); 
                box-shadow: 0 0 10px rgba(239, 68, 68, 0.2) inset; 
            }
        }
        
        .alert-active {
            animation: flashAlert 0.5s ease-in-out infinite;
            border-color: var(--alert-color) !important;
        }

        .timer-card {
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-indigo-300 border-b border-slate-700 pb-4 shadow-sm">
            マルチタイマー
        </h1>

        <div class="mb-8 p-6 bg-slate-800 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-slate-200 flex items-center">
                <span class="mr-2 text-indigo-400">#</span> システム設定
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Volume Control -->
                <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <label for="masterVolume" class="block text-sm font-medium text-slate-400 mb-2">マスター音量</label>
                    <div class="flex items-center space-x-4">
                        <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.5" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        <span class="text-sm font-bold w-12 text-right" id="volumeDisplay">50%</span>
                    </div>
                </div>

                <div class="flex items-end space-x-3">
                    <button id="btnStartAll" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-3 px-4 rounded-lg font-bold transition-colors shadow">
                        一括開始
                    </button>
                    <button id="btnStopAll" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-3 px-4 rounded-lg font-bold transition-colors shadow opacity-50 cursor-not-allowed" disabled>
                        一括停止
                    </button>
                    <button id="btnResetAll" class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-3 px-4 rounded-lg font-bold transition-colors shadow">
                        リセット
                    </button>
                </div>
            </div>

            <div class="bg-slate-900 p-4 rounded-lg border border-slate-700">
                <label for="configInput" class="block text-sm font-medium text-slate-400 mb-2">タイマー設定 (1行につき1プロセス, 最後は '|' で終わる)</label>
                <textarea id="configInput" rows="5" class="w-full p-3 bg-slate-800 border border-slate-600 rounded-lg text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y leading-relaxed" spellcheck="false">60|
30>60>10|
20>R(5,10)>10|
R(15,30)|</textarea>
                
                <div class="mt-4 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                    <div class="text-xs text-slate-400 leading-tight space-y-1">
                        <p><span class="text-indigo-300 font-semibold">構文例:</span></p>
                        <p><code>60|</code> : 60秒の繰り返し</p>
                        <p><code>30>60>10|</code> : 30秒 → 60秒 → 10秒の順</p>
                        <p><code>20>R(5,10)>10|</code> : ランダム(5〜10秒)を含む順</p>
                    </div>
                    <button id="btnApplyConfig" class="bg-teal-600 hover:bg-teal-500 text-white py-2 px-6 rounded-lg font-bold transition-colors shadow text-sm">
                        設定を反映
                    </button>
                </div>
            </div>
        </div>

        <h2 class="text-xl font-semibold mb-4 text-slate-200 border-b border-slate-700 pb-2 flex items-center">
            <span class="mr-2 text-indigo-400">#</span> 実行中のタイマー
        </h2>
        <div id="timersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Timer nodes will be generated here -->
        </div>
    </div>

    <script>
        // Audio Context Setup
        // Audio Context Setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let masterVolume = 0.5;
        const ALERT_DURATION = 3; // 合図を行う秒数

        // 音声パターンの定義 (タイマーごとに割り当て)
        const audioPatterns = [
            { type: 'sine', freq: 523.25 },     // C5 (柔らかい音)
            { type: 'triangle', freq: 659.25 }, // E5
            { type: 'square', freq: 783.99 },   // G5 (電子音)
            { type: 'sawtooth', freq: 880.00 }, // A5 (少し鋭い)
            { type: 'sine', freq: 1046.50 },    // C6
            { type: 'triangle', freq: 1318.51 } // E6
        ];

        // DOM Elements
        const volumeInput = document.getElementById('masterVolume');
        const volumeDisplay = document.getElementById('volumeDisplay');
        const configInput = document.getElementById('configInput');
        const btnApplyConfig = document.getElementById('btnApplyConfig');
        const timersContainer = document.getElementById('timersContainer');
        const btnStartAll = document.getElementById('btnStartAll');
        const btnStopAll = document.getElementById('btnStopAll');
        const btnResetAll = document.getElementById('btnResetAll');

        let timers = [];
        let globalIntervalId = null;
        let isRunning = false;

        volumeInput.addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value);
            volumeDisplay.textContent = Math.round(masterVolume * 100) + '%';
        });

        function playAlertSound(timer) {
            if (masterVolume <= 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            // タイマー固有の音声パターンを使用
            const pattern = timer.audioConfig || { type: 'square', freq: 880 };
            oscillator.type = pattern.type;
            oscillator.frequency.setValueAtTime(pattern.freq, audioCtx.currentTime);

            // 音量調整 (波形によって聞こえ方が違うため調整)
            let volumeModifier = (pattern.type === 'square' || pattern.type === 'sawtooth') ? 0.3 : 0.6;
            
            gainNode.gain.setValueAtTime(masterVolume * volumeModifier, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        function parseConfig() {
            const configText = configInput.value;
            const lines = configText.split('\n');
            const newTimers = [];

            lines.forEach((line, index) => {
                const trimmedLine = line.trim();
                if (!trimmedLine || !trimmedLine.endsWith('|')) return;

                const logicPart = trimmedLine.slice(0, -1);
                const stepsStr = logicPart.split('>');
                const parsedSteps = [];

                // Parse each step independently
                for (let str of stepsStr) {
                    str = str.trim();
                    if (str.startsWith('R(') && str.endsWith(')')) {
                        const params = str.slice(2, -1).split(',');
                        if (params.length === 2) {
                            parsedSteps.push({
                                type: 'random',
                                min: parseInt(params[0], 10),
                                max: parseInt(params[1], 10)
                            });
                        } else {
                            return; // Invalid format, skip this timer
                        }
                    } else {
                        const val = parseInt(str, 10);
                        if (!isNaN(val)) {
                            parsedSteps.push({ type: 'fixed', value: val });
                        } else {
                            return; // Invalid format, skip this timer
                        }
                    }
                }

                if (parsedSteps.length === 0) return;

                newTimers.push({
                    id: `pid-${Date.now()}-${index}`,
                    configStr: logicPart, // Keep string for UI
                    steps: parsedSteps,
                    currentStepIndex: 0,
                    timeLeft: getStepTime(parsedSteps[0]),
                    alertTimeLeft: 0, // Independent alert countdown
                    audioConfig: audioPatterns[index % audioPatterns.length], // 音声を割り当て
                    ui: null
                });
            });

            return newTimers;
        }

        // Helper to resolve step time
        function getStepTime(step) {
            if (step.type === 'random') {
                return Math.floor(Math.random() * (step.max - step.min + 1) + step.min);
            }
            return step.value;
        }

        // Helper to format step for UI
        function stepToString(step) {
            if (step.type === 'random') {
                return `R(${step.min}-${step.max})`;
            }
            return `${step.value}s`;
        }

        function renderTimers() {
            timersContainer.innerHTML = '';
            
            timers.forEach(timer => {
                const card = document.createElement('div');
                card.className = 'timer-card bg-slate-800 border-2 border-slate-700 rounded-xl p-4 flex flex-col relative overflow-hidden group shadow-lg';
                card.id = timer.id;

                // Header Info
                const header = document.createElement('div');
                header.className = 'flex justify-between items-start mb-2';
                
                const pidDisplay = document.createElement('span');
                pidDisplay.className = 'text-xs text-slate-400 font-medium';
                pidDisplay.textContent = `ID: ${timer.id.split('-')[2]}`;
                
                const configDisplay = document.createElement('span');
                configDisplay.className = 'text-xs text-indigo-300 font-bold tracking-tight';
                configDisplay.textContent = timer.configStr;
                
                header.appendChild(pidDisplay);
                header.appendChild(configDisplay);
                card.appendChild(header);

                // Main Time Display
                const timeContainer = document.createElement('div');
                timeContainer.className = 'flex-grow flex items-center justify-center py-4';
                
                const timeDisplay = document.createElement('div');
                timeDisplay.className = 'text-5xl font-bold text-slate-100 drop-shadow-md';
                timeDisplay.textContent = timer.timeLeft;
                timeContainer.appendChild(timeDisplay);
                card.appendChild(timeContainer);

                // Context Info (Prev / Next)
                const contextContainer = document.createElement('div');
                contextContainer.className = 'w-full flex justify-between text-xs text-slate-400 mt-auto pt-2 border-t border-slate-700/50';
                
                const prevDisplay = document.createElement('span');
                const nextDisplay = document.createElement('span');
                
                contextContainer.appendChild(prevDisplay);
                contextContainer.appendChild(nextDisplay);
                card.appendChild(contextContainer);

                // Alert Badge (Hidden by default)
                const alertBadge = document.createElement('div');
                alertBadge.className = 'absolute top-3 right-3 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider opacity-0 transition-opacity';
                alertBadge.textContent = '合図 [3]';
                card.appendChild(alertBadge);

                timersContainer.appendChild(card);

                timer.ui = {
                    card: card,
                    timeDisplay: timeDisplay,
                    prevDisplay: prevDisplay,
                    nextDisplay: nextDisplay,
                    alertBadge: alertBadge
                };

                updateTimerUIContext(timer);
            });
        }

        function updateTimerUIContext(timer) {
            if (!timer.ui) return;

            if (timer.steps.length > 1) {
                const prevIndex = (timer.currentStepIndex - 1 + timer.steps.length) % timer.steps.length;
                const nextIndex = (timer.currentStepIndex + 1) % timer.steps.length;
                
                timer.ui.prevDisplay.textContent = `← ${stepToString(timer.steps[prevIndex])}`;
                timer.ui.nextDisplay.textContent = `${stepToString(timer.steps[nextIndex])} →`;
            } else {
                timer.ui.prevDisplay.textContent = '繰り返し';
                timer.ui.nextDisplay.textContent = stepToString(timer.steps[0]);
            }
        }

        btnApplyConfig.addEventListener('click', () => {
            stopAll();
            timers = parseConfig();
            renderTimers();
            if (timers.length === 0) {
                // Minimalist visual alert instead of native alert
                configInput.classList.add('border-red-500');
                setTimeout(() => configInput.classList.remove('border-red-500'), 1000);
            }
        });

        function tick() {
            timers.forEach(timer => {
                
                // 1. Process Alert State (Independent of Countdown)
                if (timer.alertTimeLeft > 0) {
                    timer.alertTimeLeft--;
                    timer.ui.alertBadge.textContent = `合図 [${timer.alertTimeLeft}]`;
                    
                    if (timer.alertTimeLeft % 1 === 0) {
                        playAlertSound(timer); // Sound plays every second during alert
                    }

                    // Turn off alert when duration is complete
                    if (timer.alertTimeLeft <= 0) {
                        timer.ui.card.classList.remove('alert-active');
                        timer.ui.alertBadge.style.opacity = '0';
                    }
                }

                // 2. Process Countdown
                timer.timeLeft--;
                timer.ui.timeDisplay.textContent = timer.timeLeft;

                // 3. Trigger Next Step & Alert
                if (timer.timeLeft <= 0) {
                    // Start Alert Phase
                    timer.alertTimeLeft = ALERT_DURATION;
                    timer.ui.card.classList.add('alert-active');
                    timer.ui.alertBadge.style.opacity = '1';
                    timer.ui.alertBadge.textContent = `合図 [${timer.alertTimeLeft}]`;
                    playAlertSound(timer); // Initial sound

                    // **CRITICAL FEATURE**: Advance immediately to next step
                    // This allows the next countdown to proceed in the background while alerting
                    timer.currentStepIndex = (timer.currentStepIndex + 1) % timer.steps.length;
                    timer.timeLeft = getStepTime(timer.steps[timer.currentStepIndex]);
                    
                    // Update the UI immediately so the user sees the new countdown behind the alert
                    timer.ui.timeDisplay.textContent = timer.timeLeft;
                    updateTimerUIContext(timer);
                }
            });
        }

        function startAll() {
            if (isRunning || timers.length === 0) return;
            
            if (audioCtx.state === 'suspended') audioCtx.resume();

            isRunning = true;
            
            // UI Update for buttons
            btnStartAll.disabled = true;
            btnStartAll.classList.replace('opacity-100', 'opacity-50');
            btnStartAll.classList.add('cursor-not-allowed');
            
            btnStopAll.disabled = false;
            btnStopAll.classList.replace('opacity-50', 'opacity-100');
            btnStopAll.classList.remove('cursor-not-allowed');

            globalIntervalId = setInterval(tick, 1000);
        }

        function stopAll() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(globalIntervalId);
            
            // UI Update for buttons
            btnStartAll.disabled = false;
            btnStartAll.classList.replace('opacity-50', 'opacity-100');
            btnStartAll.classList.remove('cursor-not-allowed');
            
            btnStopAll.disabled = true;
            btnStopAll.classList.replace('opacity-100', 'opacity-50');
            btnStopAll.classList.add('cursor-not-allowed');

            // Freeze alerts visually
            timers.forEach(timer => {
                if (timer.alertTimeLeft > 0) {
                    timer.ui.card.classList.remove('alert-active');
                    timer.ui.alertBadge.style.opacity = '0.5'; // Dim but show it was alerting
                }
            });
        }

        function resetAll() {
            stopAll();
            timers.forEach(timer => {
                timer.currentStepIndex = 0;
                timer.alertTimeLeft = 0;
                timer.timeLeft = getStepTime(timer.steps[0]);

                if(timer.ui) {
                    timer.ui.card.classList.remove('alert-active');
                    timer.ui.alertBadge.style.opacity = '0';
                    timer.ui.timeDisplay.textContent = timer.timeLeft;
                    updateTimerUIContext(timer);
                }
            });
        }

        btnStartAll.addEventListener('click', startAll);
        btnStopAll.addEventListener('click', stopAll);
        btnResetAll.addEventListener('click', resetAll);

        // Initialize on load
        window.onload = () => {
            btnApplyConfig.click(); 
        };

    </script>
</body>
</html>
