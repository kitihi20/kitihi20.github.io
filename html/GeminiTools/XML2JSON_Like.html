<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML to JSON-like Converter</title>
    <style>
        /* ダークモードのカラーパレット */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        main {
            display: flex;
            flex: 1;
            padding: 1.5rem;
            gap: 1.5rem;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .panel-header {
            padding: 0.75rem 1rem;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #aaa;
        }

        textarea {
            flex: 1;
            width: 100%;
            padding: 1rem;
            background-color: transparent;
            color: #fff;
            border: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace; /* プログラム風のフォント */
            font-size: 14px;
            line-height: 1.6;
            outline: none;
        }

        textarea::placeholder {
            color: #555;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .arrow-icon {
            font-size: 1.5rem;
            color: #666;
            margin: 1rem 0;
        }

        /* レスポンシブ対応（スマホ・タブレット用） */
        @media (max-width: 768px) {
            main {
                flex-direction: column;
                overflow-y: auto;
            }
            .panel {
                min-height: 300px;
                flex: none;
            }
            .controls {
                flex-direction: row;
            }
            .arrow-icon {
                transform: rotate(90deg);
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>XML → JSON-like 変換ツール</h1>
    </header>
    
    <main>
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">変換前 (XML風)</span>
            </div>
            <textarea id="input" placeholder="<TagName>&#10;テキスト&#10;</TagName>"></textarea>
        </div>

        <div class="controls">
            <div class="arrow-icon">➔</div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">変換後 (JSON風)</span>
                <button id="copyBtn">コピー</button>
            </div>
            <textarea id="output" readonly placeholder="変換結果がここに表示されます"></textarea>
        </div>
    </main>

    <script>
        const inputEl = document.getElementById('input');
        const outputEl = document.getElementById('output');
        const copyBtn = document.getElementById('copyBtn');

        // 変換処理を行う関数
        function convertText() {
            const input = inputEl.value;
            // <タグ名>内容</タグ名> を抽出する正規表現
            const regex = /<([^>]+)>([\s\S]*?)<\/\1>/g;
            const results = [];
            let match;
            
            // マッチするすべてのブロックを処理
            while ((match = regex.exec(input)) !== null) {
                const tagName = match[1];
                // 前後の空白・改行を削除
                const content = match[2].trim();
                // 内部の改行文字を文字列の "\n" に置換
                const escapedContent = content.replace(/\r?\n/g, '\\n');
                
                // 目的のフォーマットで配列に追加
                results.push(`"${tagName}": "${escapedContent}"`);
            }
            
            // カンマと改行で結合して出力
            outputEl.value = results.join(',\n');
        }

        // 入力エリアが変更されるたびにリアルタイムで変換
        inputEl.addEventListener('input', convertText);

        // クリップボードへコピーする処理
        copyBtn.addEventListener('click', () => {
            if (!outputEl.value) return;
            
            outputEl.select();
            document.execCommand('copy');
            
            // ボタンのテキストを一時的に変更してフィードバック
            const originalText = copyBtn.innerText;
            copyBtn.innerText = 'コピー完了！';
            setTimeout(() => {
                copyBtn.innerText = originalText;
            }, 2000);
        });

        // 初期表示用のサンプルデータをセットして初回の変換を実行
        inputEl.value = `<SomeSection>\nテストテキスト\nXMLっぽいものからjsonっぽいものへ\n</SomeSection>\n\n<A>\n今日は良い天気\n明日も晴れるかな\nお昼寝しよう\n</A>`;
        convertText();
    </script>
</body>
</html>
