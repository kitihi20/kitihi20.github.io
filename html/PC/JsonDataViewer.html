      // 先頭が 'root' で、実データに 'root' キーが無い場合は仮想ルートとして除去する
      if (parts[0] === 'root') {
        if (rawObj && typeof rawObj === 'object' && Object.prototype.hasOwnProperty.call(rawObj, 'root')) {
          return parts;
        }
        return parts.slice(1);
      }
      return parts;
    };

    const getValue = (obj, pathArray) => {
      let current = obj;
      for (const key of pathArray) {
        if (current === null || current === undefined) return undefined;
        current = current[key];
      }
      return current;
    };

    const stripVirtualRoot = (p) => {
      const s = (p || '').trim();
      if (s === 'root') return '';
      if (s.startsWith('root.')) return s.substring(5);
      return s;
    };

    const normalizeFieldPath = (fieldPath, listPath) => {
      const fp = stripVirtualRoot(fieldPath);
      const lp = stripVirtualRoot(listPath);
      if (lp && fp.startsWith(lp + '.')) {
        return fp.substring(lp.length + 1);
      }
      return fp;
    };

    const parseFieldList = (str) => {
      if (!str) return [];
      return str.split(',').map(s => s.trim()).filter(Boolean);
    };

    const showToast = (message, type = 'info') => {
      const palette = {
        info: 'bg-slate-800 border-slate-700 text-slate-100',
        success: 'bg-emerald-950/95 border-emerald-700/70 text-emerald-200',
        warn: 'bg-amber-950/95 border-amber-700/70 text-amber-200',
        error: 'bg-rose-950/95 border-rose-700/70 text-rose-200'
      };
      const iconName = {
        info: 'info',
        success: 'check-circle-2',
        warn: 'alert-triangle',
        error: 'alert-circle'
      }[type] || 'info';

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2 px-3.5 py-2.5 rounded-xl border shadow-xl text-xs font-medium backdrop-blur transition-all duration-200 ${palette[type] || palette.info}`;
      toast.innerHTML = `<i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i><span class="leading-snug">${escapeHTML(message)}</span>`;
      els.toastContainer.appendChild(toast);
      lucide.createIcons({ nodes: [toast] });

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        setTimeout(() => toast.remove(), 220);
      }, 2800);
    };

    // =========================================================================
    // モバイルドロワー制御
    // =========================================================================
    const openMobileDrawer = () => {
      els.sidebarDrawer.classList.remove('-translate-x-full');
      els.mobileBackdrop.classList.remove('hidden');
      document.body.classList.add('overflow-hidden', 'md:overflow-auto');
    };

    const closeMobileDrawer = () => {
      els.sidebarDrawer.classList.add('-translate-x-full');
      els.mobileBackdrop.classList.add('hidden');
      document.body.classList.remove('overflow-hidden', 'md:overflow-auto');
    };

    // =========================================================================
    // お気に入りURL & iframe 制御
    // =========================================================================
    const loadBookmarks = () => {
      try {
        const raw = localStorage.getItem(BOOKMARKS_STORAGE_KEY);
        if (!raw) {
          state.bookmarks = [...DEFAULT_BOOKMARKS];
          localStorage.setItem(BOOKMARKS_STORAGE_KEY, JSON.stringify(state.bookmarks));
        } else {
          const parsed = JSON.parse(raw);
          state.bookmarks = Array.isArray(parsed) && parsed.length > 0 ? parsed : [...DEFAULT_BOOKMARKS];
        }
      } catch {
        state.bookmarks = [...DEFAULT_BOOKMARKS];
      }
      if (!state.selectedBookmarkId && state.bookmarks.length > 0) {
        state.selectedBookmarkId = state.bookmarks[0].id;
      }
      renderBookmarksUI();
    };

    const saveBookmarksStorage = () => {
      try {
        localStorage.setItem(BOOKMARKS_STORAGE_KEY, JSON.stringify(state.bookmarks));
      } catch (e) {
        console.warn('localStorage save failed', e);
      }
    };

    const renderBookmarksUI = () => {
      els.bookmarkCount.textContent = `${state.bookmarks.length}件`;
      let optionsHtml = '<option value="">-- 新規 / 選択解除 --</option>';
      for (const bm of state.bookmarks) {
        const selected = bm.id === state.selectedBookmarkId ? 'selected' : '';
        optionsHtml += `<option value="${escapeHTML(bm.id)}" ${selected}>${escapeHTML(bm.name)}</option>`;
      }
      els.selectBookmark.innerHTML = optionsHtml;

      const active = state.bookmarks.find(b => b.id === state.selectedBookmarkId);
      if (active) {
        els.inputBookmarkName.value = active.name;
        els.inputBookmarkUrl.value = active.url;
        els.btnDeleteBookmark.disabled = false;
      } else {
        els.btnDeleteBookmark.disabled = true;
      }
    };

    const handleBookmarkSelectChange = () => {
      state.selectedBookmarkId = els.selectBookmark.value;
      const active = state.bookmarks.find(b => b.id === state.selectedBookmarkId);
      if (active) {
        els.inputBookmarkName.value = active.name;
        els.inputBookmarkUrl.value = active.url;
      }
      els.btnDeleteBookmark.disabled = !active;
    };

    const handleSaveBookmark = () => {
      const url = els.inputBookmarkUrl.value.trim();
      let name = els.inputBookmarkName.value.trim();
      if (!url) {
        showToast('URLを入力してください。', 'warn');
        return;
      }
      if (!name) {
        try {
          name = new URL(url).hostname;
        } catch {
          name = url.slice(0, 32);
        }
      }

      const existingIdx = state.bookmarks.findIndex(b => b.id === state.selectedBookmarkId);
      if (existingIdx >= 0) {
        state.bookmarks[existingIdx] = { ...state.bookmarks[existingIdx], name, url };
        showToast(`「${name}」を更新しました`, 'success');
      } else {
        const newId = 'bm-' + Date.now();
        state.bookmarks.push({ id: newId, name, url });
        state.selectedBookmarkId = newId;
        showToast(`「${name}」をお気に入りに追加しました`, 'success');
      }
      saveBookmarksStorage();
      renderBookmarksUI();
    };

    const handleDeleteBookmark = () => {
      if (!state.selectedBookmarkId) return;
      const target = state.bookmarks.find(b => b.id === state.selectedBookmarkId);
      state.bookmarks = state.bookmarks.filter(b => b.id !== state.selectedBookmarkId);
      state.selectedBookmarkId = state.bookmarks[0]?.id || '';
      if (!state.selectedBookmarkId) {
        els.inputBookmarkName.value = '';
        els.inputBookmarkUrl.value = '';
      }
      saveBookmarksStorage();
      renderBookmarksUI();
      if (target) showToast(`「${target.name}」を削除しました`, 'info');
    };

    const openUrlInIframe = (customUrl = null) => {
      const url = (customUrl ?? els.inputBookmarkUrl.value).trim();
      if (!url) {
        showToast('開くURLを入力または選択してください。', 'warn');
        return;
      }
      state.iframeOpen = true;
      state.iframeUrl = url;
      els.iframeCurrentUrl.textContent = url;
      els.iframeStatusNote.classList.add('hidden');
      els.iframeStatusNote.textContent = '';
      els.iframePanel.classList.remove('hidden');
      els.urlPreviewIframe.src = url;
      closeMobileDrawer();
      els.iframePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };

    const openUrlInNewTab = () => {
      const url = (els.inputBookmarkUrl.value || state.iframeUrl).trim();
      if (!url) {
        showToast('開くURLを入力または選択してください。', 'warn');
        return;
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    };

    const tryReadFromIframe = () => {
      try {
        const doc = els.urlPreviewIframe.contentDocument || els.urlPreviewIframe.contentWindow?.document;
        if (!doc || !doc.body) {
          throw new Error('クロスオリジン制限によりiframe内のテキストへ直接アクセスできません');
        }
        const text = (doc.body.innerText || doc.body.textContent || '').trim();
        if (!text) {
          showToast('iframe内からテキストを取得できませんでした。手動コピーをお試しください。', 'warn');
          return;
        }
        applyJsonTextAndRender(text);
        showToast('iframe内からJSONを読み込みました', 'success');
      } catch (e) {
        els.iframeStatusNote.textContent = '※外部サイトのため直接読込がブロックされています。枠内で全選択コピーし「クリップボードから貼り付けて反映」を押してください。';
        els.iframeStatusNote.classList.remove('hidden');
        showToast('外部サイトのため手動コピー＋貼付ボタンをご利用ください', 'warn');
      }
    };

    // =========================================================================
    // JSON読み込み・パース
    // =========================================================================
    const applyJsonTextAndRender = (text, closeDrawer = true) => {
      els.text.value = text;
      state.config.jsonText = text;
      syncUrlParamsFromState();
      parseAndRenderData();
      if (closeDrawer) closeMobileDrawer();
    };

    const handlePasteFromClipboard = async () => {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        showToast('ブラウザがクリップボード読取に対応していません。下の入力欄に貼り付けてください。', 'warn');
        els.text.focus();
        return;
      }
      try {
        const clipText = await navigator.clipboard.readText();
        if (!clipText || !clipText.trim()) {
          showToast('クリップボードが空です。JSONをコピーしてから再度お試しください。', 'warn');
          return;
        }
        applyJsonTextAndRender(clipText);
        if (!state.error) {
          showToast('クリップボードのJSONを読み込みました', 'success');
        }
      } catch (err) {
        showToast('クリップボードへのアクセスが許可されませんでした。入力欄にCtrl+Vで貼り付けてください。', 'warn');
        els.text.focus();
      }
    };

    const handleFileLoad = (file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = String(e.target?.result || '');
        applyJsonTextAndRender(content);
        if (!state.error) {
          showToast(`「${file.name}」を読み込みました`, 'success');
        }
      };
      reader.onerror = () => {
        showToast('ファイルの読み込みに失敗しました。', 'error');
      };
      reader.readAsText(file, 'utf-8');
    };

    // =========================================================================
    // データ解析・フィールド自動検出
    // =========================================================================
    const resolveList = (rawData, listPath) => {
      if (!rawData) return null;
      const pathArr = getPathArray(listPath, rawData);
      if (pathArr.length === 0) return rawData;
      return getValue(rawData, pathArr);
    };

    const findArrayPaths = (obj, prefix = '', depth = 0, out = []) => {
      if (depth > 3 || obj === null || obj === undefined || typeof obj !== 'object') return out;
      if (Array.isArray(obj)) {
        out.push({ path: prefix || 'root', count: obj.length });
        return out;
      }
      for (const [k, v] of Object.entries(obj)) {
        const nextPath = prefix ? `${prefix}.${k}` : k;
        if (Array.isArray(v)) {
          out.push({ path: nextPath, count: v.length });
        } else if (v && typeof v === 'object') {
          findArrayPaths(v, nextPath, depth + 1, out);
        }
      }
      return out;
    };

    const collectFieldPaths = (list) => {
      const pathSet = new Set();
      const sampleCount = Math.min(list.length, 25);

      const walk = (val, prefix, depth) => {
        if (depth > 3 || val === null || val === undefined) return;
        if (Array.isArray(val)) {
          if (prefix) pathSet.add(prefix);
          if (val.length > 0 && typeof val[0] === 'object' && val[0] !== null) {
            walk(val[0], `${prefix}.0`, depth + 1);
          }
          return;
        }
        if (typeof val === 'object') {
          for (const [k, v] of Object.entries(val)) {
            const p = prefix ? `${prefix}.${k}` : k;
            if (v === null || v === undefined || typeof v !== 'object') {
              pathSet.add(p);
            } else {
              walk(v, p, depth + 1);
            }
          }
        } else if (prefix) {
          pathSet.add(prefix);
        }
      };

      for (let i = 0; i < sampleCount; i++) {
        if (list[i] && typeof list[i] === 'object') {
          walk(list[i], '', 0);
        }
      }
      return Array.from(pathSet);
    };

    const renderFieldPicker = () => {
      if (!state.detectedFields.length) {
        els.fieldPickerWrapper.classList.add('hidden');
        return;
      }
      els.fieldPickerWrapper.classList.remove('hidden');
      els.fieldPickerChips.innerHTML = state.detectedFields.map(path => `
        <button
          type="button"
          data-field-chip="${escapeHTML(path)}"
          class="px-2 py-0.5 rounded-md bg-slate-900 hover:bg-blue-600/30 text-slate-300 hover:text-blue-200 border border-slate-700 hover:border-blue-500/40 text-[11px] font-mono transition-colors"
        >${escapeHTML(path)}</button>
      `).join('');
    };

    const renderQuickSortOptions = () => {
      const currentSort = normalizeFieldPath(state.config.sortField, state.config.listPath);
      const candidates = new Set(state.detectedFields);
      if (currentSort) candidates.add(currentSort);

      let html = '<option value="">ソートなし</option>';
      for (const field of candidates) {
        const selected = field === currentSort ? 'selected' : '';
        html += `<option value="${escapeHTML(field)}" ${selected}>${escapeHTML(field)}</option>`;
      }
      els.quickSortField.innerHTML = html;

      const isAsc = state.config.sortOrder === 'asc';
      els.quickSortOrderLabel.textContent = isAsc ? '昇順' : '降順';
      els.quickSortIcon.setAttribute('data-lucide', isAsc ? 'arrow-up-narrow-wide' : 'arrow-down-wide-narrow');
      lucide.createIcons({ nodes: [els.btnQuickSortOrder] });
    };

    // =========================================================================
    // 検索・フィルタリングロジック
    // =========================================================================
    const parseSearchTerms = (query) => {
      const tokens = (query || '').trim().split(/\s+/).filter(Boolean);
      const positive = [];
      const negative = [];
      for (const token of tokens) {
        if (token.startsWith('-') && token.length > 1) {
          negative.push(token.slice(1).toLowerCase());
        } else {
          positive.push(token.toLowerCase());
        }
      }
      return { positive, negative };
    };

    const collectAllPrimitiveValues = (val, bucket = []) => {
      if (val === null || val === undefined) return bucket;
      if (Array.isArray(val)) {
        for (const item of val) collectAllPrimitiveValues(item, bucket);
      } else if (typeof val === 'object') {
        for (const v of Object.values(val)) collectAllPrimitiveValues(v, bucket);
      } else {
        bucket.push(String(val));
      }
      return bucket;
    };

    const getSearchableText = (item) => {
      if (state.searchScope === 'visible') {
        const fields = [
          ...parseFieldList(state.config.titleField),
          ...parseFieldList(state.config.subFields),
          ...parseFieldList(state.config.mainFields)
        ];
        const parts = [];
        for (const f of fields) {
          const norm = normalizeFieldPath(f, state.config.listPath);
          const val = getValue(item, getPathArray(norm));
          if (val !== undefined && val !== null) {
            collectAllPrimitiveValues(val, parts);
          }
        }
        return parts.join(' ').toLowerCase();
      }
      return collectAllPrimitiveValues(item).join(' ').toLowerCase();
    };

    const matchesSearch = (item, terms) => {
      if (terms.positive.length === 0 && terms.negative.length === 0) return true;
      const haystack = getSearchableText(item);
      for (const pos of terms.positive) {
        if (!haystack.includes(pos)) return false;
      }
      for (const neg of terms.negative) {
        if (haystack.includes(neg)) return false;
      }
      return true;
    };

    const stringifyForFilter = (val) => {
      if (val === undefined || val === null) return '';
      if (typeof val === 'object') return JSON.stringify(val);
      return String(val);
    };

    const matchesFilters = (item) => {
      // 1. Numeric range filters
      for (const [fieldPath, range] of Object.entries(state.filters.numeric)) {
        const hasMin = range.min !== '' && range.min !== null && range.min !== undefined;
        const hasMax = range.max !== '' && range.max !== null && range.max !== undefined;
        if (!hasMin && !hasMax) continue;

        const norm = normalizeFieldPath(fieldPath, state.config.listPath);
        const val = getValue(item, getPathArray(norm));
        const num = Number(val);
        if (val === null || val === undefined || val === '' || Number.isNaN(num)) return false;
        if (hasMin && num < Number(range.min)) return false;
        if (hasMax && num > Number(range.max)) return false;
      }

      // 2. Categorical chip filters
      for (const [fieldPath, selectedSet] of Object.entries(state.filters.categorical)) {
        if (!selectedSet || selectedSet.size === 0) continue;
        const norm = normalizeFieldPath(fieldPath, state.config.listPath);
        const val = getValue(item, getPathArray(norm));
        const strVal = (val === null || val === undefined || val === '') ? '(空)' : String(val);
        if (!selectedSet.has(strVal)) return false;
      }

      // 3. Custom rules
      for (const rule of state.filters.custom) {
        if (!rule.field) continue;
        const norm = normalizeFieldPath(rule.field, state.config.listPath);
        const rawVal = getValue(item, getPathArray(norm));
        const strVal = stringifyForFilter(rawVal);
        const target = (rule.value ?? '').trim();

        switch (rule.op) {
          case 'not_empty':
            if (rawVal === undefined || rawVal === null || strVal.trim() === '') return false;
            break;
          case 'empty':
            if (rawVal !== undefined && rawVal !== null && strVal.trim() !== '') return false;
            break;
          case 'contains':
            if (target && !strVal.toLowerCase().includes(target.toLowerCase())) return false;
            break;
          case 'not_contains':
            if (target && strVal.toLowerCase().includes(target.toLowerCase())) return false;
            break;
          case 'eq':
            if (target && strVal.toLowerCase() !== target.toLowerCase()) return false;
            break;
          case 'neq':
            if (target && strVal.toLowerCase() === target.toLowerCase()) return false;
            break;
          case 'gte': {
            if (target === '') break;
            const nVal = Number(rawVal);
            const nTarget = Number(target);
            if (!Number.isNaN(nVal) && !Number.isNaN(nTarget)) {
              if (nVal < nTarget) return false;
            } else if (strVal < target) {
              return false;
            }
            break;
          }
          case 'lte': {
            if (target === '') break;
            const nVal = Number(rawVal);
            const nTarget = Number(target);
            if (!Number.isNaN(nVal) && !Number.isNaN(nTarget)) {
              if (nVal > nTarget) return false;
            } else if (strVal > target) {
              return false;
            }
            break;
          }
        }
      }

      return true;
    };

    const countActiveFilters = () => {
      let count = 0;
      for (const range of Object.values(state.filters.numeric)) {
        if ((range.min ?? '') !== '' || (range.max ?? '') !== '') count++;
      }
      for (const set of Object.values(state.filters.categorical)) {
        if (set && set.size > 0) count++;
      }
      for (const rule of state.filters.custom) {
        if (!rule.field) continue;
        if (rule.op === 'empty' || rule.op === 'not_empty' || (rule.value ?? '').trim() !== '') {
          count++;
        }
      }
      return count;
    };

    // =========================================================================
    // ファセット＆カスタムフィルターUI生成
    // =========================================================================
    const buildFacetMetadata = (list) => {
      const subPaths = parseFieldList(state.config.subFields).map(f => normalizeFieldPath(f, state.config.listPath));
      const numericFacets = [];
      const categoricalFacets = [];

      for (const fieldPath of subPaths) {
        const pathArr = getPathArray(fieldPath);
        const values = list.map(item => getValue(item, pathArr));
        const nonNull = values.filter(v => v !== undefined && v !== null && v !== '');
        if (nonNull.length === 0) continue;

        const allNumbers = nonNull.every(v => typeof v === 'number' && !Number.isNaN(v));
        if (allNumbers) {
          const min = Math.min(...nonNull);
          const max = Math.max(...nonNull);
          // id/stockなど1種類しかない場合でも範囲表示可能だが、すべて同じ値ならスキップしてもよい
          if (min !== max || fieldPath.toLowerCase().includes('price')) {
            numericFacets.push({ fieldPath, min, max });
            continue;
          }
        }

        // カテゴリ判定 (オブジェクトは除外)
        const allScalars = nonNull.every(v => typeof v !== 'object');
        if (!allScalars) continue;

        const counts = new Map();
        for (const v of values) {
          const key = (v === undefined || v === null || v === '') ? '(空)' : String(v);
          counts.set(key, (counts.get(key) || 0) + 1);
        }
        const entries = Array.from(counts.entries());
        const avgLen = entries.reduce((acc, [k]) => acc + k.length, 0) / entries.length;
        if (entries.length >= 2 && entries.length <= 25 && avgLen <= 40) {
          entries.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
          categoricalFacets.push({ fieldPath, entries });
        }
      }

      return { numericFacets, categoricalFacets };
    };

    const renderFacetFilters = (list) => {
      if (!Array.isArray(list) || list.length === 0) {
        els.facetFilters.innerHTML = '<p class="text-xs text-slate-500">データを読み込むとクイックフィルターが表示されます。</p>';
        return;
      }

      const { numericFacets, categoricalFacets } = buildFacetMetadata(list);
      if (numericFacets.length === 0 && categoricalFacets.length === 0) {
        els.facetFilters.innerHTML = '<p class="text-xs text-slate-500">サブ情報項目に価格やカテゴリを設定すると、自動クイックフィルターが表示されます。</p>';
        return;
      }

      let html = '';

      if (numericFacets.length > 0) {
        html += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
        for (const nf of numericFacets) {
          const cur = state.filters.numeric[nf.fieldPath] || { min: '', max: '' };
          html += `
            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-semibold text-slate-200 font-mono">${escapeHTML(nf.fieldPath)}</span>
                <span class="text-[11px] text-slate-500">${nf.min.toLocaleString()} 〜 ${nf.max.toLocaleString()}</span>
              </div>
              <div class="flex items-center gap-2">
                <input
                  type="number"
                  data-num-filter="min"
                  data-field="${escapeHTML(nf.fieldPath)}"
                  value="${escapeHTML(cur.min)}"
                  placeholder="最小 (${nf.min})"
                  class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <span class="text-slate-500 text-xs">〜</span>
                <input
                  type="number"
                  data-num-filter="max"
                  data-field="${escapeHTML(nf.fieldPath)}"
                  value="${escapeHTML(cur.max)}"
                  placeholder="最大 (${nf.max})"
                  class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>
          `;
        }
        html += `</div>`;
      }

      if (categoricalFacets.length > 0) {
        html += `<div class="space-y-2.5">`;
        for (const cf of categoricalFacets) {
          const selectedSet = state.filters.categorical[cf.fieldPath] || new Set();
          html += `
            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-200 font-mono">${escapeHTML(cf.fieldPath)}</span>
                ${selectedSet.size > 0
              ? `<button type="button" data-clear-cat="${escapeHTML(cf.fieldPath)}" class="text-[11px] text-blue-400 hover:text-blue-300">選択解除 (${selectedSet.size})</button>`
              : `<span class="text-[11px] text-slate-500">${cf.entries.length}種類</span>`
            }
              </div>
              <div class="flex flex-wrap gap-1.5">
                ${cf.entries.map(([val, cnt]) => {
              const active = selectedSet.has(val);
              const cls = active
                ? 'bg-blue-600 text-white border-blue-500 shadow-sm'
                : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border-slate-700';
              return `
                    <button
                      type="button"
                      data-cat-field="${escapeHTML(cf.fieldPath)}"
                      data-cat-val="${escapeHTML(val)}"
                      class="px-2.5 py-1 rounded-lg border text-xs font-medium flex items-center gap-1.5 transition-colors ${cls}"
                    >
                      <span>${escapeHTML(val)}</span>
                      <span class="text-[10px] ${active ? 'text-blue-100' : 'text-slate-500'}">(${cnt})</span>
                    </button>
                  `;
            }).join('')}
              </div>
            </div>
          `;
        }
        html += `</div>`;
      }

      els.facetFilters.innerHTML = html;
    };

    const renderCustomFilterRules = () => {
      if (state.filters.custom.length === 0) {
        els.customFiltersList.innerHTML = '<p class="text-xs text-slate-500">「条件を追加」から任意のJSONキーに対する絞り込みを追加できます。</p>';
        return;
      }

      const fieldOptions = state.detectedFields;
      const ops = [
        { value: 'contains', label: '含む' },
        { value: 'not_contains', label: '含まない' },
        { value: 'eq', label: '等しい (=)' },
        { value: 'neq', label: '等しくない (!=)' },
        { value: 'gte', label: '以上 (>=)' },
        { value: 'lte', label: '以下 (<=)' },
        { value: 'not_empty', label: '空でない' },
        { value: 'empty', label: '空である' }
      ];

      els.customFiltersList.innerHTML = state.filters.custom.map(rule => {
        const hideValue = rule.op === 'empty' || rule.op === 'not_empty';
        const optionsHtml = fieldOptions.map(f =>
          `<option value="${escapeHTML(f)}" ${f === rule.field ? 'selected' : ''}>${escapeHTML(f)}</option>`
        ).join('');
        const opsHtml = ops.map(o =>
          `<option value="${o.value}" ${o.value === rule.op ? 'selected' : ''}>${o.label}</option>`
        ).join('');

        return `
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 bg-slate-950/70 border border-slate-800 rounded-xl p-2" data-rule-id="${rule.id}">
            <select data-rule-prop="field" class="sm:w-48 px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 font-mono focus:outline-none focus:ring-2 focus:ring-violet-500">
              <option value="">-- フィールド選択 --</option>
              ${optionsHtml}
            </select>
            <select data-rule-prop="op" class="sm:w-36 px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-violet-500">
              ${opsHtml}
            </select>
            <input
              type="text"
              data-rule-prop="value"
              value="${escapeHTML(rule.value)}"
              placeholder="条件値..."
              class="flex-1 px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 ${hideValue ? 'hidden' : ''}"
            />
            <button
              type="button"
              data-remove-rule="${rule.id}"
              class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 border border-slate-700 text-xs flex items-center justify-center transition-colors shrink-0"
              title="条件を削除"
            >
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');

      lucide.createIcons({ nodes: [els.customFiltersList] });
    };

    // =========================================================================
    // カード描画ヘルパー (ハイライト・スペック整形・価格/ランク装飾)
    // =========================================================================
    const highlightPlainText = (rawText, positiveTerms) => {
      const str = String(rawText);
      if (!positiveTerms || positiveTerms.length === 0) {
        return escapeHTML(str);
      }
      const uniqueTerms = Array.from(new Set(positiveTerms.filter(Boolean)));
      if (uniqueTerms.length === 0) return escapeHTML(str);

      const pattern = new RegExp(`(${uniqueTerms.map(escapeRegExp).join('|')})`, 'gi');
      let result = '';
      let lastIndex = 0;
      let match;

      while ((match = pattern.exec(str)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHTML(str.slice(lastIndex, match.index));
        }
        result += `<mark class="bg-amber-500/30 text-amber-200 px-0.5 rounded font-medium">${escapeHTML(match[0])}</mark>`;
        lastIndex = pattern.lastIndex;
        if (match[0].length === 0) break;
      }
      if (lastIndex < str.length) {
        result += escapeHTML(str.slice(lastIndex));
      }
      return result;
    };

    const formatFieldRawValue = (val) => {
      if (val === undefined || val === null) return null;
      if (typeof val === 'object') {
        return JSON.stringify(val, null, 2);
      }
      return String(val);
    };

    const parseSpecPairs = (text) => {
      if (typeof text !== 'string') return null;
      const trimmed = text.trim();
      if (!trimmed || trimmed.includes('\n\n')) return null;

      // Key:Value が空白区切りで3つ以上並んでいるかチェック
      const regex = /(?:^|\s)([^\s:：/()\[\]]{1,24})[:：]/g;
      const matches = [];
      let m;
      while ((m = regex.exec(trimmed)) !== null) {
        const key = m[1];
        const lower = key.toLowerCase();
        // 時刻(12:30)やURLプロトコル(http/https/ftp)を除外
        if (/^\d+$/.test(key) || lower === 'http' || lower === 'https' || lower === 'ftp') {
          continue;
        }
        const keyStart = m.index + (m[0].startsWith(' ') || m[0].startsWith('\t') ? 1 : 0);
        matches.push({
          key,
          keyStart,
          valStart: regex.lastIndex
        });
      }

      if (matches.length < 3) return null;

      const pairs = [];
      for (let i = 0; i < matches.length; i++) {
        const end = i + 1 < matches.length ? matches[i + 1].keyStart : trimmed.length;
        const value = trimmed.slice(matches[i].valStart, end).trim();
        pairs.push({ key: matches[i].key, value });
      }
      return pairs;
    };

    const isPriceField = (fieldPath, rawValue) => {
      const leaf = fieldPath.split('.').pop().toLowerCase();
      return (leaf === 'price' || leaf.endsWith('_price') || leaf.endsWith('price')) && typeof rawValue === 'number';
    };

    const isRankField = (fieldPath) => {
      const leaf = fieldPath.split('.').pop().toLowerCase();
      return leaf === 'rank' || leaf.endsWith('_rank');
    };

    const getRankBadgeClasses = (rankVal) => {
      const r = String(rankVal).trim().toUpperCase();
      if (r === 'S' || r === 'A' || r === 'NEW') {
        return 'bg-cyan-500/15 text-cyan-300 border-cyan-500/40';
      }
      if (r === 'B' || r === 'C') {
        return 'bg-blue-500/15 text-blue-300 border-blue-500/40';
      }
      if (r === 'D') {
        return 'bg-amber-500/15 text-amber-300 border-amber-500/40';
      }
      if (r === 'J' || r === 'JUNK') {
        return 'bg-rose-500/15 text-rose-300 border-rose-500/40';
      }
      return 'bg-slate-800 text-slate-200 border-slate-700';
    };

    const renderMainFieldBlock = (item, fieldPath, positiveTerms) => {
      const norm = normalizeFieldPath(fieldPath, state.config.listPath);
      const val = getValue(item, getPathArray(norm));
      const strVal = formatFieldRawValue(val);

      let contentHtml = '';
      if (strVal === null) {
        contentHtml = '<span class="text-slate-600 italic text-xs">データなし</span>';
      } else if (strVal.trim() === '') {
        contentHtml = '<span class="text-slate-600 italic text-xs">（空）</span>';
      } else {
        const specPairs = state.config.smartFormat ? parseSpecPairs(strVal) : null;
        if (specPairs) {
          contentHtml = `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
              ${specPairs.map(pair => `
                <div class="bg-slate-950/75 border border-slate-800/90 rounded-lg px-3 py-2 flex flex-col gap-0.5">
                  <span class="text-[10px] font-bold text-blue-400 tracking-wide">${highlightPlainText(pair.key, positiveTerms)}</span>
                  <span class="text-xs text-slate-200 break-words leading-snug">${highlightPlainText(pair.value || '-', positiveTerms)}</span>
                </div>
              `).join('')}
            </div>
          `;
        } else if (typeof val === 'object') {
          contentHtml = `<pre class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 overflow-x-auto leading-relaxed">${highlightPlainText(strVal, positiveTerms)}</pre>`;
        } else {
          contentHtml = `<div class="bg-slate-950/45 border border-slate-800/70 rounded-xl px-3.5 py-2.5 text-sm text-slate-300 leading-relaxed whitespace-pre-wrap break-words">${highlightPlainText(strVal, positiveTerms)}</div>`;
        }
      }

      return `
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <span>${escapeHTML(norm || fieldPath)}</span>
          </div>
          ${contentHtml}
        </div>
      `;
    };

    const renderClassicMainFieldBlock = (item, fieldPath, positiveTerms) => {
      const norm = normalizeFieldPath(fieldPath, state.config.listPath);
      const val = getValue(item, getPathArray(norm));
      const strVal = formatFieldRawValue(val);

      let valueHtml = '';
      if (strVal === null) {
        valueHtml = '<span class="text-slate-600 italic text-sm">データなし</span>';
      } else if (strVal.trim() === '') {
        valueHtml = '<span class="text-slate-600 italic text-sm">（空）</span>';
      } else if (typeof val === 'object') {
        valueHtml = `<pre class="bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300 overflow-x-auto leading-relaxed">${highlightPlainText(strVal, positiveTerms)}</pre>`;
      } else {
        valueHtml = `<div class="text-sm sm:text-base text-slate-300 leading-loose whitespace-pre-wrap break-words">${highlightPlainText(strVal, positiveTerms)}</div>`;
      }

      return `
        <div>
          <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">
            ${escapeHTML(fieldPath)}
          </div>
          ${valueHtml}
        </div>
      `;
    };

    const renderCard = (item, index, positiveTerms) => {
      const titleFields = parseFieldList(state.config.titleField);
      const subFields = parseFieldList(state.config.subFields);
      const mainFields = parseFieldList(state.config.mainFields);

      const primaryTitlePath = titleFields[0] || '';
      const normTitlePath = normalizeFieldPath(primaryTitlePath, state.config.listPath);
      const titleVal = primaryTitlePath ? getValue(item, getPathArray(normTitlePath)) : undefined;
      const titleHtml = (titleVal !== undefined && titleVal !== null)
        ? highlightPlainText(String(titleVal), positiveTerms)
        : '<span class="text-slate-500 italic text-base">タイトルなし</span>';

      const itemKey = String(item?.id ?? index);
      const isJsonExpanded = state.expandedJsonIds.has(itemKey);

      const footerHtml = `
        <div class="pt-3 mt-1 border-t border-slate-800/70 flex items-center justify-between gap-2 text-[11px] text-slate-500">
          <div class="flex items-center gap-2 font-mono">
            <span>#${index + 1}</span>
            ${item?.id !== undefined ? `<span class="px-1.5 py-0.5 rounded bg-slate-800/70 text-slate-400">id: ${escapeHTML(item.id)}</span>` : ''}
          </div>
          <div class="flex items-center gap-1.5">
            <button
              type="button"
              data-copy-json="${escapeHTML(itemKey)}"
              class="px-2 py-1 rounded-lg bg-slate-800/70 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-700/70 flex items-center gap-1 transition-colors"
              title="この項目のJSONをコピー"
            >
              <i data-lucide="copy" class="w-3 h-3"></i>
              <span>コピー</span>
            </button>
            <button
              type="button"
              data-toggle-json="${escapeHTML(itemKey)}"
              class="px-2 py-1 rounded-lg ${isJsonExpanded ? 'bg-blue-600/20 text-blue-300 border-blue-500/40' : 'bg-slate-800/70 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border-slate-700/70'} border font-mono flex items-center gap-1 transition-colors"
            >
              <span>{ } JSON</span>
            </button>
          </div>
        </div>
        ${isJsonExpanded ? `
          <pre class="mt-2 bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] font-mono text-slate-300 overflow-x-auto max-h-80 leading-relaxed">${escapeHTML(JSON.stringify(item, null, 2))}</pre>
        ` : ''}
      `;

      // サブ情報なし -> 従来風のタイトル + メインのみシンプル表示
      if (subFields.length === 0) {
        return `
          <article class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 sm:p-7 shadow-lg shadow-black/20 transition-colors">
            <div class="flex flex-col gap-5">
              ${primaryTitlePath ? `
                <div class="border-b border-slate-800 pb-4">
                  <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">
                    ${escapeHTML(primaryTitlePath)}
                  </div>
                  <h3 class="text-lg sm:text-2xl font-bold text-slate-50 leading-snug break-words">
                    ${titleHtml}
                  </h3>
                </div>
              ` : ''}
              ${mainFields.map(f => renderClassicMainFieldBlock(item, f, positiveTerms)).join('')}
              ${footerHtml}
            </div>
          </article>
        `;
      }

      // サブ情報あり -> タイトル + サブ情報(価格・ランク・属性ピル) + メイン情報(Detail等) の階層カード表示
      const featuredMetrics = [];
      const metaPills = [];

      for (const sf of subFields) {
        const norm = normalizeFieldPath(sf, state.config.listPath);
        const val = getValue(item, getPathArray(norm));
        if (val === undefined || val === null || val === '') continue;

        if (isPriceField(norm, val)) {
          const formatted = `¥${Number(val).toLocaleString('ja-JP')}`;
          featuredMetrics.push(`
            <div class="px-3 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-extrabold text-lg sm:text-xl tabular-nums shrink-0">
              ${highlightPlainText(formatted, positiveTerms)}
            </div>
          `);
        } else if (isRankField(norm)) {
          const badgeCls = getRankBadgeClasses(val);
          featuredMetrics.push(`
            <div class="px-2.5 py-1 rounded-xl border text-xs font-extrabold tracking-wider shrink-0 ${badgeCls}">
              RANK ${highlightPlainText(String(val), positiveTerms)}
            </div>
          `);
        } else {
          const strVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
          metaPills.push(`
            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/70 text-xs">
              <span class="text-slate-400 font-mono text-[11px]">${escapeHTML(norm)}:</span>
              <span class="text-slate-200 font-medium break-all">${highlightPlainText(strVal, positiveTerms)}</span>
            </div>
          `);
        }
      }

      return `
        <article class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 sm:p-6 shadow-lg shadow-black/20 transition-colors">
          <div class="flex flex-col gap-4">
            <!-- カードヘッダー: タイトル + 価格/ランク + サブ情報ピル -->
            <div class="pb-4 border-b border-slate-800/90 space-y-3">
              <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2.5">
                <div class="min-w-0 flex-1">
                  ${primaryTitlePath ? `<div class="text-[10px] font-mono uppercase tracking-wider text-slate-500 mb-1">${escapeHTML(normTitlePath || primaryTitlePath)}</div>` : ''}
                  <h3 class="text-base sm:text-xl font-bold text-slate-50 leading-snug break-words">
                    ${titleHtml}
                  </h3>
                </div>
                ${featuredMetrics.length > 0 ? `
                  <div class="flex flex-wrap items-center gap-2 shrink-0 sm:pt-1">
                    ${featuredMetrics.join('')}
                  </div>
                ` : ''}
              </div>

              ${metaPills.length > 0 ? `
                <div class="flex flex-wrap items-center gap-1.5">
                  ${metaPills.join('')}
                </div>
              ` : ''}
            </div>

            <!-- カードボディ: メイン情報 -->
            ${mainFields.length > 0 ? `
              <div class="space-y-3.5">
                ${mainFields.map(f => renderMainFieldBlock(item, f, positiveTerms)).join('')}
              </div>
            ` : ''}

            ${footerHtml}
          </div>
        </article>
      `;
    };

    // =========================================================================
    // メインデータ処理＆レンダリング
    // =========================================================================
    let currentRenderedItems = []; // JSONコピー用に保持

    const parseAndRenderData = () => {
      state.error = null;
      const text = state.config.jsonText.trim();

      if (!text) {
        state.rawData = null;
        state.detectedFields = [];
        renderFieldPicker();
        renderResults();
        return;
      }

      try {
        state.rawData = JSON.parse(text);
      } catch (e) {
        state.rawData = null;
        state.detectedFields = [];
        state.error = `JSONのパースに失敗しました。構文が正しいか確認してください。\n(${e.message})`;
        renderFieldPicker();
        renderResults();
        return;
      }

      const list = resolveList(state.rawData, state.config.listPath);
      if (Array.isArray(list)) {
        state.detectedFields = collectFieldPaths(list);
        renderFieldPicker();
        renderQuickSortOptions();
        renderFacetFilters(list);
        renderCustomFilterRules();
      } else {
        state.detectedFields = [];
        renderFieldPicker();
      }

      renderResults();
    };

    const renderResults = () => {
      // エラー表示
      if (state.error) {
        els.toolbar.classList.add('hidden');
        els.filterPanel.classList.add('hidden');
        els.mobileCountBadge.classList.add('hidden');
        els.resultsContainer.innerHTML = `
          <div class="bg-rose-950/40 border border-rose-800/70 rounded-2xl p-5 flex items-start gap-3.5 text-rose-200">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="space-y-1 min-w-0">
              <h3 class="font-bold text-sm">エラーが発生しました</h3>
              <p class="text-xs text-rose-200/80 whitespace-pre-wrap leading-relaxed break-words">${escapeHTML(state.error)}</p>
            </div>
          </div>
        `;
        lucide.createIcons({ nodes: [els.resultsContainer] });
        return;
      }

      // 未入力・ウェルカム表示
      if (!state.rawData) {
        els.toolbar.classList.add('hidden');
        els.filterPanel.classList.add('hidden');
        els.mobileCountBadge.classList.add('hidden');
        els.resultsContainer.innerHTML = `
          <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 sm:p-10 text-center space-y-6 my-4">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-center">
              <i data-lucide="file-json-2" class="w-7 h-7 text-blue-400"></i>
            </div>
            <div class="space-y-2 max-w-lg mx-auto">
              <h2 class="text-lg sm:text-xl font-bold text-slate-100">JSON リストを見やすく可視化</h2>
              <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">
                JSONを貼り付けるか、ファイル読み込み・お気に入りURLのiframe表示からJSONをコピーして読み込めます。タイトル・価格/ランク等のサブ情報・詳細スペックを整理して表示します。
              </p>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2.5 pt-2">
              <button type="button" id="welcome-btn-sample" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-semibold flex items-center gap-2 transition-colors shadow-lg shadow-blue-950/40">
                <i data-lucide="flask-conical" class="w-4 h-4"></i>
                <span>サンプルデータを表示</span>
              </button>
              <button type="button" id="welcome-btn-paste" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-medium flex items-center gap-2 transition-colors">
                <i data-lucide="clipboard-paste" class="w-4 h-4 text-blue-400"></i>
                <span>クリップボードから読込</span>
              </button>
              <label for="input-json-file" class="cursor-pointer px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-medium flex items-center gap-2 transition-colors">
                <i data-lucide="folder-open" class="w-4 h-4 text-amber-400"></i>
                <span>JSONファイルを開く</span>
              </label>
              <button type="button" id="welcome-btn-iframe" class="px-4 py-2.5 rounded-xl bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 text-xs sm:text-sm font-medium flex items-center gap-2 transition-colors">
                <i data-lucide="globe" class="w-4 h-4"></i>
                <span>お気に入りURLをiframeで開く</span>
              </button>
            </div>
          </div>
        `;
        lucide.createIcons({ nodes: [els.resultsContainer] });
        document.getElementById('welcome-btn-sample')?.addEventListener('click', handleLoadSample);
        document.getElementById('welcome-btn-paste')?.addEventListener('click', handlePasteFromClipboard);
        document.getElementById('welcome-btn-iframe')?.addEventListener('click', () => openUrlInIframe());
        return;
      }

      // リスト配列解決
      const list = resolveList(state.rawData, state.config.listPath);
      if (!Array.isArray(list)) {
        els.toolbar.classList.add('hidden');
        els.filterPanel.classList.add('hidden');
        els.mobileCountBadge.classList.add('hidden');
        const candidates = findArrayPaths(state.rawData);
        const candidatesHtml = candidates.length > 0
          ? `
            <div class="pt-3 space-y-2">
              <p class="text-xs text-amber-200/80 font-semibold">見つかった配列パス候補 (クリックで適用):</p>
              <div class="flex flex-wrap gap-2">
                ${candidates.map(c => `
                  <button type="button" data-fix-list-path="${escapeHTML(c.path)}" class="px-3 py-1.5 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-200 text-xs font-mono transition-colors">
                    ${escapeHTML(c.path)} (${c.count}件)
                  </button>
                `).join('')}
              </div>
            </div>
          `
          : '';

        els.resultsContainer.innerHTML = `
          <div class="bg-amber-950/35 border border-amber-700/60 rounded-2xl p-5 flex items-start gap-3.5 text-amber-200">
            <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-400 shrink-0 mt-0.5"></i>
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-sm">指定されたパス「${escapeHTML(state.config.listPath || '(ルート)')}」に配列が見つかりません</h3>
              <p class="text-xs text-amber-200/80 mt-1">リストのパス設定を確認してください。</p>
              ${candidatesHtml}
            </div>
          </div>
        `;
        lucide.createIcons({ nodes: [els.resultsContainer] });
        els.resultsContainer.querySelectorAll('[data-fix-list-path]').forEach(btn => {
          btn.addEventListener('click', () => {
            const p = btn.getAttribute('data-fix-list-path');
            state.config.listPath = p === 'root' ? '' : p;
            els.listPath.value = state.config.listPath;
            syncUrlParamsFromState();
            parseAndRenderData();
          });
        });
        return;
      }

      // ツールバー表示
      els.toolbar.classList.remove('hidden');

      // 検索＆フィルター適用
      const terms = parseSearchTerms(state.searchQuery);
      let filtered = list.filter(item => matchesSearch(item, terms) && matchesFilters(item));

      // ソート処理
      if (state.config.sortField) {
        const normSort = normalizeFieldPath(state.config.sortField, state.config.listPath);
        const sortPathArr = getPathArray(normSort);
        filtered = [...filtered].sort((a, b) => {
          const valA = getValue(a, sortPathArr);
          const valB = getValue(b, sortPathArr);
          if (valA === valB) return 0;
          if (valA == null) return 1;
          if (valB == null) return -1;

          let cmp = 0;
          if (typeof valA === 'number' && typeof valB === 'number') {
            cmp = valA - valB;
          } else {
            cmp = String(valA).localeCompare(String(valB), 'ja', { numeric: true });
          }
          return state.config.sortOrder === 'asc' ? cmp : -cmp;
        });
      }

      currentRenderedItems = filtered;

      // 件数・アクティブフィルターバッジ更新
      const activeFilterCount = countActiveFilters();
      const hasSearch = Boolean(state.searchQuery.trim());
      els.resultsCountText.textContent = `${filtered.length} 件表示`;
      els.resultsTotalText.textContent = filtered.length !== list.length ? `(全 ${list.length} 件中)` : '';
      els.mobileCountBadge.textContent = `${filtered.length}件`;
      els.mobileCountBadge.classList.remove('hidden');

      if (activeFilterCount > 0) {
        els.filterActiveBadge.textContent = String(activeFilterCount);
        els.filterActiveBadge.classList.remove('hidden');
      } else {
        els.filterActiveBadge.classList.add('hidden');
      }

      els.btnResetAllFilters.classList.toggle('hidden', !hasSearch && activeFilterCount === 0);
      els.btnClearSearch.classList.toggle('hidden', !hasSearch);

      // カードリスト描画
      if (filtered.length === 0) {
        els.resultsContainer.innerHTML = `
          <div class="bg-slate-900/60 border border-dashed border-slate-700 rounded-2xl py-12 px-4 text-center space-y-3">
            <i data-lucide="search-x" class="w-10 h-10 text-slate-600 mx-auto"></i>
            <p class="text-sm text-slate-400">
              ${list.length === 0 ? '指定された配列にデータが含まれていません。' : '検索またはフィルター条件に一致するデータがありません。'}
            </p>
            ${list.length > 0 ? `
              <button type="button" id="btn-empty-reset" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition-colors">
                検索・フィルターをリセット
              </button>
            ` : ''}
          </div>
        `;
        lucide.createIcons({ nodes: [els.resultsContainer] });
        document.getElementById('btn-empty-reset')?.addEventListener('click', resetSearchAndFilters);
        return;
      }

      els.resultsContainer.innerHTML = `
        <div class="space-y-4">
          ${filtered.map((item, idx) => renderCard(item, idx, terms.positive)).join('')}
        </div>
      `;
      lucide.createIcons({ nodes: [els.resultsContainer] });
    };

    // =========================================================================
    // 状態・URLクエリ同期 & イベントハンドラ
    // =========================================================================
    const updateFormFromState = () => {
      els.text.value = state.config.jsonText;
      els.listPath.value = state.config.listPath;
      els.titleField.value = state.config.titleField;
      els.subFields.value = state.config.subFields;
      els.mainFields.value = state.config.mainFields;
      els.smartFormat.checked = state.config.smartFormat;
      els.sortField.value = state.config.sortField;
      els.sortOrder.value = state.config.sortOrder;
    };

    const syncStateFromForm = () => {
      state.config.jsonText = els.text.value;
      state.config.listPath = els.listPath.value.trim();
      state.config.titleField = els.titleField.value.trim();
      state.config.subFields = els.subFields.value.trim();
      state.config.mainFields = els.mainFields.value.trim();
      state.config.smartFormat = els.smartFormat.checked;
      state.config.sortField = els.sortField.value.trim();
      state.config.sortOrder = els.sortOrder.value;
    };

    const syncUrlParamsFromState = () => {
      const params = new URLSearchParams();
      if (state.config.listPath) params.set('list', state.config.listPath);
      if (state.config.titleField) params.set('title', state.config.titleField);
      params.set('sub', state.config.subFields);
      if (state.config.mainFields) params.set('main', state.config.mainFields);
      if (state.config.sortField) params.set('sort', state.config.sortField);
      if (state.config.sortOrder) params.set('order', state.config.sortOrder);
      params.set('smart', state.config.smartFormat ? '1' : '0');

      const newUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', newUrl);
    };

    const resetSearchAndFilters = () => {
      state.searchQuery = '';
      els.inputSearch.value = '';
      state.filters.numeric = {};
      state.filters.categorical = {};
      state.filters.custom = [];
      const list = resolveList(state.rawData, state.config.listPath);
      if (Array.isArray(list)) {
        renderFacetFilters(list);
      }
      renderCustomFilterRules();
      renderResults();
    };

    const handleApply = (e) => {
      e.preventDefault();
      syncStateFromForm();
      syncUrlParamsFromState();
      parseAndRenderData();
      closeMobileDrawer();
    };

    const handleLoadSample = () => {
      state.config = {
        ...state.config,
        jsonText: getSampleJsonString(),
        listPath: DEFAULT_FIELD_PRESET.listPath,
        titleField: DEFAULT_FIELD_PRESET.titleField,
        subFields: DEFAULT_FIELD_PRESET.subFields,
        mainFields: DEFAULT_FIELD_PRESET.mainFields,
        sortField: DEFAULT_FIELD_PRESET.sortField,
        sortOrder: DEFAULT_FIELD_PRESET.sortOrder,
        smartFormat: true
      };
      state.filters.numeric = {};
      state.filters.categorical = {};
      state.filters.custom = [];
      state.searchQuery = '';
      els.inputSearch.value = '';
      updateFormFromState();
      syncUrlParamsFromState();
      parseAndRenderData();
      closeMobileDrawer();
      showToast('サンプルデータを読み込みました', 'success');
    };

    // =========================================================================
    // 初期化
    // =========================================================================
    const init = () => {
      const params = new URLSearchParams(window.location.search);

      state.config.listPath = params.has('list') ? params.get('list') : DEFAULT_FIELD_PRESET.listPath;
      state.config.sortField = params.has('sort') ? params.get('sort') : DEFAULT_FIELD_PRESET.sortField;
      state.config.sortOrder = params.get('order') === 'asc' ? 'asc' : 'desc';
      state.config.smartFormat = params.get('smart') !== '0';

      if (params.has('title') || params.has('sub') || params.has('main')) {
        state.config.titleField = params.get('title') ?? DEFAULT_FIELD_PRESET.titleField;
        state.config.subFields = params.get('sub') ?? '';
        state.config.mainFields = params.get('main') ?? DEFAULT_FIELD_PRESET.mainFields;
      } else if (params.has('fields')) {
        // 旧 fields パラメータ互換 (先頭をタイトル、残りをメイン情報にして従来風レイアウトで表示)
        const legacy = parseFieldList(params.get('fields'));
        state.config.titleField = legacy[0] || '';
        state.config.subFields = '';
        state.config.mainFields = legacy.slice(1).join(', ');
      } else {
        state.config.titleField = DEFAULT_FIELD_PRESET.titleField;
        state.config.subFields = DEFAULT_FIELD_PRESET.subFields;
        state.config.mainFields = DEFAULT_FIELD_PRESET.mainFields;
      }

      if (params.has('text')) {
        state.config.jsonText = params.get('text') || '';
      }

      loadBookmarks();
      updateFormFromState();
      parseAndRenderData();

      // モバイルドロワーイベント
      els.btnMobileDrawerOpen.addEventListener('click', openMobileDrawer);
      els.btnMobileDrawerClose.addEventListener('click', closeMobileDrawer);
      els.mobileBackdrop.addEventListener('click', closeMobileDrawer);
      els.btnMobileIframe.addEventListener('click', () => openUrlInIframe());

      // お気に入りURL・iframeイベント
      els.selectBookmark.addEventListener('change', handleBookmarkSelectChange);
      els.btnSaveBookmark.addEventListener('click', handleSaveBookmark);
      els.btnDeleteBookmark.addEventListener('click', handleDeleteBookmark);
      els.btnOpenIframe.addEventListener('click', () => openUrlInIframe());
      els.btnOpenNewtab.addEventListener('click', openUrlInNewTab);

      els.btnIframePaste.addEventListener('click', handlePasteFromClipboard);
      els.btnIframeRead.addEventListener('click', tryReadFromIframe);
      els.btnIframeInvert.addEventListener('click', () => {
        state.iframeInverted = !state.iframeInverted;
        els.urlPreviewIframe.style.filter = state.iframeInverted ? 'invert(0.9) hue-rotate(180deg)' : '';
        els.btnIframeInvert.classList.toggle('bg-cyan-600/25', state.iframeInverted);
        els.btnIframeInvert.classList.toggle('text-cyan-300', state.iframeInverted);
        els.btnIframeInvert.classList.toggle('border-cyan-500/40', state.iframeInverted);
        els.btnIframeInvert.classList.toggle('bg-slate-800', !state.iframeInverted);
        els.btnIframeInvert.classList.toggle('text-slate-300', !state.iframeInverted);
        els.btnIframeInvert.classList.toggle('border-slate-700', !state.iframeInverted);
      });
      els.btnIframeReload.addEventListener('click', () => {
        if (state.iframeUrl) els.urlPreviewIframe.src = state.iframeUrl;
      });
      els.btnIframeResize.addEventListener('click', () => {
        state.iframeExpanded = !state.iframeExpanded;
        els.urlPreviewIframe.classList.toggle('h-64', !state.iframeExpanded);
        els.urlPreviewIframe.classList.toggle('h-[460px]', state.iframeExpanded);
      });
      els.btnIframeNewtab.addEventListener('click', openUrlInNewTab);
      els.btnIframeClose.addEventListener('click', () => {
        state.iframeOpen = false;
        els.iframePanel.classList.add('hidden');
      });

      // フォーム・JSON入力イベント
      els.form.addEventListener('submit', handleApply);
      els.btnSample.addEventListener('click', handleLoadSample);
      els.btnPasteClipboard.addEventListener('click', handlePasteFromClipboard);
      els.inputJsonFile.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (file) handleFileLoad(file);
        e.target.value = '';
      });

      // ドラッグ＆ドロップ
      ['dragenter', 'dragover'].forEach(evName => {
        els.jsonDropzone.addEventListener(evName, (e) => {
          e.preventDefault();
          els.text.classList.add('drag-active');
        });
      });
      ['dragleave', 'drop'].forEach(evName => {
        els.jsonDropzone.addEventListener(evName, (e) => {
          e.preventDefault();
          els.text.classList.remove('drag-active');
        });
      });
      els.jsonDropzone.addEventListener('drop', (e) => {
        const file = e.dataTransfer?.files?.[0];
        if (file) handleFileLoad(file);
      });

      els.btnFormatJson.addEventListener('click', () => {
        try {
          const parsed = JSON.parse(els.text.value);
          els.text.value = JSON.stringify(parsed, null, 2);
          state.config.jsonText = els.text.value;
          showToast('JSONを整形しました', 'info');
        } catch {
          showToast('有効なJSONではないため整形できません', 'warn');
        }
      });

      els.btnClearJson.addEventListener('click', () => {
        els.text.value = '';
        state.config.jsonText = '';
        state.rawData = null;
        state.error = null;
        state.detectedFields = [];
        renderFieldPicker();
        renderResults();
      });

      // レイアウトプリセット・オプション
      els.btnPresetRich.addEventListener('click', () => {
        els.titleField.value = DEFAULT_FIELD_PRESET.titleField;
        els.subFields.value = DEFAULT_FIELD_PRESET.subFields;
        els.mainFields.value = DEFAULT_FIELD_PRESET.mainFields;
        syncStateFromForm();
        syncUrlParamsFromState();
        parseAndRenderData();
      });
      els.btnPresetSimple.addEventListener('click', () => {
        els.subFields.value = '';
        syncStateFromForm();
        syncUrlParamsFromState();
        parseAndRenderData();
      });
      els.btnClearSub.addEventListener('click', () => {
        els.subFields.value = '';
        syncStateFromForm();
        syncUrlParamsFromState();
        parseAndRenderData();
      });
      els.smartFormat.addEventListener('change', () => {
        state.config.smartFormat = els.smartFormat.checked;
        syncUrlParamsFromState();
        renderResults();
      });

      // フィールド候補クリック
      els.fieldPickerChips.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-field-chip]');
        if (!btn) return;
        const field = btn.getAttribute('data-field-chip');
        const target = els.selectPickerTarget.value;
        if (target === 'title') {
          els.titleField.value = field;
        } else if (target === 'sort') {
          els.sortField.value = field;
        } else {
          const inputEl = target === 'sub' ? els.subFields : els.mainFields;
          const current = parseFieldList(inputEl.value);
          if (!current.includes(field)) {
            current.push(field);
            inputEl.value = current.join(', ');
          }
        }
        syncStateFromForm();
        syncUrlParamsFromState();
        parseAndRenderData();
      });

      // 検索・クイックソート・フィルターイベント
      els.inputSearch.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderResults();
      });
      els.btnClearSearch.addEventListener('click', () => {
        state.searchQuery = '';
        els.inputSearch.value = '';
        els.inputSearch.focus();
        renderResults();
      });
      els.selectSearchScope.addEventListener('change', (e) => {
        state.searchScope = e.target.value;
        renderResults();
      });

      els.quickSortField.addEventListener('change', (e) => {
        state.config.sortField = e.target.value;
        els.sortField.value = e.target.value;
        syncUrlParamsFromState();
        renderResults();
      });
      els.btnQuickSortOrder.addEventListener('click', () => {
        state.config.sortOrder = state.config.sortOrder === 'asc' ? 'desc' : 'asc';
        els.sortOrder.value = state.config.sortOrder;
        renderQuickSortOptions();
        syncUrlParamsFromState();
        renderResults();
      });

      els.btnToggleFilters.addEventListener('click', () => {
        state.filterPanelOpen = !state.filterPanelOpen;
        els.filterPanel.classList.toggle('hidden', !state.filterPanelOpen);
      });
      els.btnResetAllFilters.addEventListener('click', resetSearchAndFilters);

      // ファセットフィルターイベント (委譲)
      els.facetFilters.addEventListener('input', (e) => {
        const input = e.target.closest('[data-num-filter]');
        if (!input) return;
        const bound = input.getAttribute('data-num-filter');
        const field = input.getAttribute('data-field');
        if (!state.filters.numeric[field]) {
          state.filters.numeric[field] = { min: '', max: '' };
        }
        state.filters.numeric[field][bound] = input.value;
        renderResults();
      });

      els.facetFilters.addEventListener('click', (e) => {
        const catBtn = e.target.closest('[data-cat-field]');
        if (catBtn) {
          const field = catBtn.getAttribute('data-cat-field');
          const val = catBtn.getAttribute('data-cat-val');
          if (!state.filters.categorical[field]) {
            state.filters.categorical[field] = new Set();
          }
          const set = state.filters.categorical[field];
          if (set.has(val)) set.delete(val);
          else set.add(val);
          const list = resolveList(state.rawData, state.config.listPath);
          if (Array.isArray(list)) renderFacetFilters(list);
          renderResults();
          return;
        }
        const clearBtn = e.target.closest('[data-clear-cat]');
        if (clearBtn) {
          const field = clearBtn.getAttribute('data-clear-cat');
          delete state.filters.categorical[field];
          const list = resolveList(state.rawData, state.config.listPath);
          if (Array.isArray(list)) renderFacetFilters(list);
          renderResults();
        }
      });

      // カスタム条件ルールイベント
      els.btnAddCustomRule.addEventListener('click', () => {
        state.filters.custom.push({
          id: String(Date.now() + Math.random()),
          field: state.detectedFields[0] || '',
          op: 'contains',
          value: ''
        });
        renderCustomFilterRules();
        renderResults();
      });

      els.customFiltersList.addEventListener('change', (e) => {
        const row = e.target.closest('[data-rule-id]');
        if (!row) return;
        const ruleId = row.getAttribute('data-rule-id');
        const prop = e.target.getAttribute('data-rule-prop');
        const rule = state.filters.custom.find(r => r.id === ruleId);
        if (!rule || !prop) return;
        rule[prop] = e.target.value;
        if (prop === 'op') {
          renderCustomFilterRules();
        }
        renderResults();
      });

      els.customFiltersList.addEventListener('input', (e) => {
        if (e.target.getAttribute('data-rule-prop') !== 'value') return;
        const row = e.target.closest('[data-rule-id]');
        if (!row) return;
        const ruleId = row.getAttribute('data-rule-id');
        const rule = state.filters.custom.find(r => r.id === ruleId);
        if (!rule) return;
        rule.value = e.target.value;
        renderResults();
      });

      els.customFiltersList.addEventListener('click', (e) => {
        const rmBtn = e.target.closest('[data-remove-rule]');
        if (!rmBtn) return;
        const ruleId = rmBtn.getAttribute('data-remove-rule');
        state.filters.custom = state.filters.custom.filter(r => r.id !== ruleId);
        renderCustomFilterRules();
        renderResults();
      });

      // カード内のJSONトグル・コピー (委譲)
      els.resultsContainer.addEventListener('click', async (e) => {
        const toggleBtn = e.target.closest('[data-toggle-json]');
        if (toggleBtn) {
          const key = toggleBtn.getAttribute('data-toggle-json');
          if (state.expandedJsonIds.has(key)) state.expandedJsonIds.delete(key);
          else state.expandedJsonIds.add(key);
          renderResults();
          return;
        }
        const copyBtn = e.target.closest('[data-copy-json]');
        if (copyBtn) {
          const key = copyBtn.getAttribute('data-copy-json');
          const targetItem = currentRenderedItems.find((it, i) => String(it?.id ?? i) === key);
          if (!targetItem) return;
          try {
            await navigator.clipboard.writeText(JSON.stringify(targetItem, null, 2));
            showToast('アイテムのJSONをコピーしました', 'success');
          } catch {
            showToast('クリップボードへのコピーに失敗しました', 'warn');
          }
        }
      });

      lucide.createIcons();
    };

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
