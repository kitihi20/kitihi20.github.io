<!DOCTYPE html>
<html lang="ja" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Data Viewer</title>
  <!-- Tailwind CSS -->
  <script src="/js/tailwindcss_3_4_17.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      color-scheme: dark;
    }

    select,
    select option {
      background-color: #0f172a;
      color: #e2e8f0;
    }

    /* Dark custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f172a;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .drag-active {
      border-color: #3b82f6 !important;
      background-color: rgba(30, 58, 138, 0.2) !important;
    }
  </style>
</head>

<body
  class="bg-slate-950 font-sans text-slate-100 antialiased selection:bg-blue-500/30 selection:text-blue-200 overflow-x-hidden">

  <!-- モバイル用トップヘッダー -->
  <header
    class="md:hidden sticky top-0 z-30 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3.5 py-2.5 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <div
        class="w-8 h-8 rounded-lg bg-blue-500/15 border border-blue-500/30 flex items-center justify-center shrink-0">
        <i data-lucide="database" class="w-4 h-4 text-blue-400"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-bold text-sm text-slate-100 truncate">JSON Viewer</h1>
      </div>
      <span id="mobile-count-badge"
        class="hidden text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 shrink-0">
        0件
      </span>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button type="button" id="btn-mobile-iframe"
        class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition-colors">
        <i data-lucide="globe" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>URL / 取得</span>
      </button>
      <button type="button" id="btn-mobile-drawer-open"
        class="px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm">
        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
        <span>設定</span>
      </button>
    </div>
  </header>

  <!-- モバイル用ドロワー背景オーバーレイ -->
  <div id="mobile-backdrop" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm hidden md:hidden"></div>

  <div class="flex flex-col md:flex-row min-h-screen">

    <!-- サイドバー (データソース・お気に入りURL・設定パネル) -->
    <aside id="sidebar-drawer"
      class="fixed inset-y-0 left-0 z-50 w-[88vw] max-w-sm bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl transform -translate-x-full transition-transform duration-200 ease-out md:translate-x-0 md:static md:w-80 lg:w-96 md:h-screen md:sticky md:top-0 shrink-0">
      <!-- サイドバーヘッダー -->
      <div class="px-4 py-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-900/95 shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-500/15 border border-blue-500/30 flex items-center justify-center">
            <i data-lucide="database" class="w-4 h-4 text-blue-400"></i>
          </div>
          <div>
            <h1 class="font-bold text-base tracking-wide text-slate-100 leading-tight">JSON Viewer</h1>
            <p class="text-[11px] text-slate-400">Dark List Explorer</p>
          </div>
        </div>
        <button type="button" id="btn-mobile-drawer-close"
          class="md:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors"
          aria-label="設定を閉じる">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- スクロール可能なフォーム領域 -->
      <form id="settings-form" class="flex-1 overflow-y-auto p-4 space-y-5">

        <!-- 1. お気に入りURL & iframe取得支援 -->
        <section class="bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
              <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
              お気に入りURL &amp; 参照
            </h2>
            <span id="bookmark-count" class="text-[10px] text-slate-500"></span>
          </div>

          <div class="space-y-2">
            <select id="select-bookmark"
              class="w-full px-2.5 py-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-cyan-500/60">
              <option value="">-- お気に入りURLを選択 --</option>
            </select>

            <input type="text" id="input-bookmark-name" placeholder="登録名 (例: イオシス ジャンク)"
              class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/60" />

            <input type="url" id="input-bookmark-url" placeholder="https://example.com/api/data.json"
              class="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-cyan-500/60" />

            <div class="flex items-center gap-1.5">
              <button type="button" id="btn-save-bookmark"
                class="flex-1 px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium flex items-center justify-center gap-1 transition-colors">
                <i data-lucide="star" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>保存</span>
              </button>
              <button type="button" id="btn-delete-bookmark"
                class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-rose-950/70 text-slate-400 hover:text-rose-300 border border-slate-700 hover:border-rose-800/70 text-xs font-medium flex items-center justify-center gap-1 transition-colors disabled:opacity-40 disabled:pointer-events-none"
                title="選択中のお気に入りを削除">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-800/80">
            <button type="button" id="btn-open-iframe"
              class="px-2.5 py-2 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
              <i data-lucide="panel-top" class="w-3.5 h-3.5"></i>
              <span>iframeで開く</span>
            </button>
            <button type="button" id="btn-open-newtab"
              class="px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              <span>別タブで開く</span>
            </button>
          </div>
        </section>

        <!-- 2. JSONデータ入力 -->
        <section class="space-y-2.5">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center gap-1.5">
              <i data-lucide="file-code-2" class="w-3.5 h-3.5"></i>
              JSON データ入力
            </label>
            <div class="flex items-center gap-1.5">
              <button type="button" id="btn-format-json"
                class="text-[11px] text-slate-400 hover:text-slate-200 px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-800 transition-colors"
                title="JSONを整形">
                整形
              </button>
              <button type="button" id="btn-clear-json"
                class="text-[11px] text-slate-400 hover:text-rose-300 px-1.5 py-0.5 rounded bg-slate-800/80 hover:bg-slate-800 transition-colors"
                title="入力をクリア">
                クリア
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btn-paste-clipboard"
              class="px-2.5 py-2 rounded-lg bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
              <i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i>
              <span>貼付して表示</span>
            </button>
            <label for="input-json-file"
              class="cursor-pointer px-2.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
              <i data-lucide="folder-open" class="w-3.5 h-3.5 text-amber-400"></i>
              <span>ファイル読込</span>
            </label>
            <input type="file" id="input-json-file" accept=".json,application/json,text/plain" class="hidden" />
          </div>

          <div id="json-dropzone" class="relative">
            <textarea id="input-text" placeholder='{"data": [...]}&#10;ここにJSONを貼り付けるか、ファイルをドロップ' rows="5"
              class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono resize-y transition-colors"></textarea>
          </div>
        </section>

        <!-- 3. パス & 表示フィールド設定 (3層構造) -->
        <section class="space-y-3 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
              <i data-lucide="layout-list" class="w-3.5 h-3.5 text-indigo-400"></i>
              表示レイアウト設定
            </h2>
            <div class="flex items-center gap-1">
              <button type="button" id="btn-preset-rich"
                class="text-[10px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                title="タイトル + サブ情報 + メイン情報">
                標準
              </button>
              <button type="button" id="btn-preset-simple"
                class="text-[10px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                title="サブ情報を空にしてタイトル+メインのみの従来表示にする">
                シンプル
              </button>
            </div>
          </div>

          <!-- List Path -->
          <div class="space-y-1">
            <label for="input-list-path" class="text-xs font-semibold text-slate-300 flex items-center justify-between">
              <span>リストのパス</span>
              <span class="text-[10px] text-slate-500 font-normal">例: data / root.data</span>
            </label>
            <input type="text" id="input-list-path" placeholder="data (空ならルート配列)"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Title Field -->
          <div class="space-y-1">
            <label for="input-title-field" class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-400"></span>
              <span>タイトル項目</span>
            </label>
            <input type="text" id="input-title-field" placeholder="例: name"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Sub Fields -->
          <div class="space-y-1">
            <label for="input-sub-fields"
              class="text-xs font-semibold text-slate-300 flex items-center justify-between">
              <span class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span>サブ情報 (価格・ランク等)</span>
              </span>
              <button type="button" id="btn-clear-sub"
                class="text-[10px] text-slate-400 hover:text-slate-200 underline">空にする</button>
            </label>
            <textarea id="input-sub-fields" rows="2"
              placeholder="空にすると従来風のシンプル表示になります&#10;例: price, rank, arrival_at, genre.name, maker.name"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
          </div>

          <!-- Main Fields -->
          <div class="space-y-1">
            <label for="input-main-fields" class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-violet-400"></span>
              <span>メイン情報 (Detail等)</span>
            </label>
            <textarea id="input-main-fields" rows="2" placeholder="例: detail, accessory, comment"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
          </div>

          <!-- Smart Spec Format Toggle -->
          <label class="flex items-center gap-2 cursor-pointer pt-1 select-none">
            <input type="checkbox" id="input-smart-format"
              class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-blue-500 focus:ring-blue-500/50 focus:ring-offset-slate-900" />
            <span class="text-xs text-slate-300">スペック文字列 (Key:Value) を表形式に整形</span>
          </label>

          <!-- Auto-detected Fields Picker -->
          <div id="field-picker-wrapper"
            class="hidden bg-slate-950/60 border border-slate-800 rounded-xl p-2.5 space-y-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3 h-3 text-amber-400"></i>
                フィールド候補 (クリックで追加)
              </span>
              <select id="select-picker-target"
                class="px-1.5 py-0.5 bg-slate-900 border border-slate-700 rounded text-[11px] text-slate-200 focus:outline-none">
                <option value="sub">サブに追加</option>
                <option value="main">メインに追加</option>
                <option value="title">タイトルに設定</option>
                <option value="sort">ソートに設定</option>
              </select>
            </div>
            <div id="field-picker-chips" class="flex flex-wrap gap-1 max-h-28 overflow-y-auto pr-1"></div>
          </div>
        </section>

        <!-- 4. ソート設定 -->
        <section class="space-y-2.5 pt-2 border-t border-slate-800">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-emerald-400"></i>
            初期ソート設定
          </h2>
          <div class="grid grid-cols-1 gap-2">
            <input type="text" id="input-sort-field" placeholder="例: arrival_at / price"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 placeholder-slate-500 font-mono focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <select id="input-sort-order"
              class="w-full px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="desc">降順 (Z → A, 9 → 1, 新着順)</option>
              <option value="asc">昇順 (A → Z, 1 → 9, 安い順)</option>
            </select>
          </div>
        </section>

      </form>

      <!-- サイドバーフッター実行ボタン -->
      <div class="p-3.5 border-t border-slate-800 bg-slate-900/95 space-y-2 shrink-0">
        <button type="submit" form="settings-form"
          class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors shadow-lg shadow-blue-950/50 text-sm">
          <i data-lucide="play" class="w-4 h-4 fill-current"></i>
          <span>データを表示・更新</span>
        </button>
        <button type="button" id="btn-sample"
          class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium py-2 px-4 rounded-xl transition-colors text-xs flex items-center justify-center gap-1.5">
          <i data-lucide="flask-conical" class="w-3.5 h-3.5 text-amber-400"></i>
          <span>サンプルデータを試す</span>
        </button>
      </div>
    </aside>

    <!-- メインコンテンツ -->
    <main id="main-content" class="flex-1 min-w-0 p-3.5 sm:p-6 lg:p-8">
      <div class="max-w-5xl mx-auto space-y-4">

        <!-- 埋め込み iframe パネル (必要時に表示・状態維持) -->
        <section id="iframe-panel"
          class="hidden bg-slate-900 border border-cyan-500/30 rounded-2xl overflow-hidden shadow-xl shadow-black/30">
          <div
            class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              <i data-lucide="globe" class="w-4 h-4 text-cyan-400 shrink-0"></i>
              <span class="text-xs font-bold text-slate-200 shrink-0">URL プレビュー</span>
              <span id="iframe-current-url" class="text-[11px] font-mono text-slate-400 truncate"></span>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              <button type="button" id="btn-iframe-paste"
                class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm">
                <i data-lucide="clipboard-paste" class="w-3.5 h-3.5"></i>
                <span>クリップボードから貼り付けて反映</span>
              </button>
              <button type="button" id="btn-iframe-read"
                class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium flex items-center gap-1 transition-colors"
                title="同一オリジンの場合のみiframe内テキストを直接読み取れます">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">直接読込を試す</span>
              </button>
              <button type="button" id="btn-iframe-invert"
                class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-medium flex items-center gap-1 transition-colors"
                title="外部サイトが白背景の場合に色を反転します">
                <i data-lucide="contrast" class="w-3.5 h-3.5"></i>
                <span class="hidden sm:inline">色反転</span>
              </button>
              <button type="button" id="btn-iframe-reload"
                class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                title="再読み込み">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" id="btn-iframe-resize"
                class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                title="高さを切り替え">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" id="btn-iframe-newtab"
                class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition-colors"
                title="別タブで開く">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" id="btn-iframe-close"
                class="p-1.5 rounded-lg bg-slate-800 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 border border-slate-700 transition-colors"
                title="閉じる">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <div
            class="px-4 py-2 bg-cyan-950/30 border-b border-slate-800 text-[11px] sm:text-xs text-cyan-200/90 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5">
            <p class="leading-relaxed">
              <span class="font-semibold text-cyan-300">手順:</span>
              下の枠内をクリックして全選択コピー (<kbd
                class="px-1 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-[10px]">Ctrl+A</kbd> →
              <kbd class="px-1 py-0.5 rounded bg-slate-800 border border-slate-700 font-mono text-[10px]">Ctrl+C</kbd>)
              し、「クリップボードから貼り付けて反映」を押してください。
              <span class="text-slate-400">※拒否されるサイトは「別タブで開く」をご利用ください。</span>
            </p>
            <span id="iframe-status-note" class="text-[11px] text-amber-300 shrink-0 hidden"></span>
          </div>

          <div class="bg-slate-950">
            <iframe id="url-preview-iframe" class="w-full h-64 bg-slate-950 transition-all duration-200"
              style="color-scheme: dark;"
              referrerpolicy="no-referrer"></iframe>
          </div>
        </section>

        <!-- 検索・フィルター・ソート ツールバー (データ読込後に表示) -->
        <section id="toolbar"
          class="hidden bg-slate-900/95 border border-slate-800 rounded-2xl p-3 sm:p-4 space-y-3 shadow-lg shadow-black/20">
          <div class="flex flex-col lg:flex-row lg:items-center gap-2.5">
