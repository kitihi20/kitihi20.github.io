  <style>
    /* -------------------------------------
       検索 & フィルター用スタイル (追加分)
       ------------------------------------- */
    .works-controls-container {
      max-width: 1200px;
      margin: 24px auto 8px;
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    .works-search-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background-color: #202020;
      box-shadow: 0px 0px 16px 4px var(--ShadowColor);
      border: 1px solid #555555;
      padding: 10px 16px;
      margin-bottom: 16px;
      transition: border-color 0.2s ease;
    }

    .works-search-wrapper:focus-within {
      border-color: #1c9dd8;
    }

    .works-search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .works-search-icon {
      font-family: var(--HeadFont), monospace;
      font-size: 14px;
      font-weight: 700;
      color: #1c9dd8;
      letter-spacing: 0.05em;
      white-space: nowrap;
      user-select: none;
    }

    .works-search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--Font_Color);
      font-size: 16px;
      font-family: var(--MainFont), Yu Gothic, Arial, sans-serif;
    }

    .works-search-input::placeholder {
      color: #888888;
    }

    .works-search-clear {
      background: none;
      border: none;
      color: #888888;
      font-size: 20px;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
      display: none;
      transition: color 0.15s ease;
    }

    .works-search-clear:hover {
      color: #ff5555;
    }

    .works-status {
      font-family: var(--HeadFont), monospace;
      font-size: 14px;
      color: #aaaaaa;
      white-space: nowrap;
      user-select: none;
    }

    .works-filter-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .works-filter-btn {
      background-color: #202020;
      box-shadow: 0px 0px 8px 2px var(--ShadowColor);
      color: var(--Font_Color);
      border: 1px solid #555555;
      padding: 6px 14px;
      font-size: 14px;
      font-family: var(--MainFont), sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .works-filter-btn:hover {
      background-color: #333333;
      border-color: #1c9dd8;
      color: #ffffff;
    }

    .works-filter-btn.active {
      background-color: #1c9dd8;
      border-color: #1c9dd8;
      color: #ffffff;
    }

    .works-filter-count {
      font-size: 12px;
      opacity: 0.85;
    }

    .othertag {
      cursor: pointer;
    }

    .otherbutton {
      cursor: pointer;
      background-color: #202020;
      color: var(--Font_Color);
      font-family: var(--MainFont), sans-serif;
      transition: all 0.2s ease;
    }

    .otherbutton:hover {
      background-color: #1c9dd8;
      border-color: #1c9dd8;
      color: #ffffff;
    }

    .empty-works {
      grid-column: 1 / -1;
      padding: 48px 16px;
      text-align: center;
      color: #aaaaaa;
      background-color: #202020;
      box-shadow: 0px 0px 16px 4px var(--ShadowColor);
      border: 1px solid #555555;
      margin: 16px;
    }

    .empty-works-title {
      font-size: 20px;
      font-family: var(--HeadFont), sans-serif;
      color: #ff8000;
      margin-bottom: 8px;
    }

    .empty-works-desc {
      font-size: 14px;
      line-height: 1.6;
    }

    .empty-reset-btn {
      margin-top: 16px;
      background-color: #202020;
      color: var(--Font_Color);
      border: 1px solid #f0f0f0;
      padding: 8px 24px;
      cursor: pointer;
      font-size: 14px;
      font-family: var(--MainFont), sans-serif;
      transition: all 0.2s ease;
    }

    .empty-reset-btn:hover {
      background-color: #1c9dd8;
      border-color: #1c9dd8;
      color: #ffffff;
    }

    @media screen and (max-width: 750px) {
      .works-search-wrapper {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .works-status {
        text-align: right;
      }
    }
  </style>
</head>

    const filterContainer = document.getElementById('works-filter-container');
    const searchInput = document.getElementById('works-search-input');
    const searchClearBtn = document.getElementById('works-search-clear');
    const statusEl = document.getElementById('works-status');

    function updateStatus(filteredCount, totalCount) {
      if (!statusEl) return;
      if (currentFilter === 'All' && !searchQuery.trim()) {
        statusEl.textContent = `${totalCount} 作品`;
      } else {
        statusEl.textContent = `${filteredCount} / ${totalCount} 作品`;
      }
    }

    function setTagFilter(tag) {
      currentFilter = tag;
      renderFilters();
      renderWorks();
    }

    function renderWorks() {
      listContainer.innerHTML = '';

      const terms = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);

      // タグと検索語句による絞り込み
      const filteredWorks = worksData.filter(work => {
        const matchesTag = currentFilter === 'All' || work.tags.includes(currentFilter);
        if (!matchesTag) return false;

        if (terms.length === 0) return true;

        const searchableText = `${work.title} ${work.desc} ${work.category} ${work.date} ${work.tags.join(' ')}`.toLowerCase();
        return terms.every(term => searchableText.includes(term));
      });

      updateStatus(filteredWorks.length, worksData.length);

      if (filteredWorks.length === 0) {
        const emptyBox = document.createElement('div');
        emptyBox.className = 'empty-works';
        emptyBox.innerHTML = `
          <div class="empty-works-title">一致する作品が見つかりませんでした</div>
          <div class="empty-works-desc">
            検索キーワードや選択中のタグ条件を変更してお試しください。
          </div>
          <button type="button" class="empty-reset-btn" id="empty-reset-btn">フィルターをリセット</button>
        `;
        listContainer.appendChild(emptyBox);

        const resetBtn = document.getElementById('empty-reset-btn');
        if (resetBtn) {
          resetBtn.addEventListener('click', () => {
            currentFilter = 'All';
            searchQuery = '';
            if (searchInput) searchInput.value = '';
            if (searchClearBtn) searchClearBtn.style.display = 'none';
            renderFilters();
            renderWorks();
          });
        }
        return;
      }

      // 作品カードのDOM生成 (other.css のスタイルに合わせたマークアップ)
      filteredWorks.forEach(work => {
        const card = document.createElement('div');
        card.className = 'box';

        const tagsHtml = work.tags.map(tag => {
          const bgColor = tagColors[tag] || '#2a3b5c';
          return `<span class="othertag" style="background-color: ${bgColor};" data-tag="${tag}" title="「${tag}」で絞り込み">${tag}</span>`;
        }).join('');

        const linkHtml = work.link
          ? `
            <a href="${work.link.url}" ${work.link.target ? `target="${work.link.target}" rel="noopener noreferrer"` : ''}>
              <button type="button" class="otherbutton">${work.link.label}</button>
            </a>
          `
          : '';

        const descHtml = work.desc.replace(/\n/g, '<br>');

        card.innerHTML = `
          <h2>${work.title}</h2>
          <img src="${work.img}" width="98%" class="otherimg" alt="${work.title}">
          <p class="othertags">
            ${tagsHtml}
          </p>
          <p>
            ${work.category}<br>
            ${work.date}
          </p>
          <p>${descHtml}</p>
          ${linkHtml}
        `;

        // カード内タグをクリックした際のフィルター切り替え
        card.querySelectorAll('.othertag').forEach(tagEl => {
          tagEl.addEventListener('click', (e) => {
            e.stopPropagation();
            const selectedTag = tagEl.getAttribute('data-tag');
            if (selectedTag) {
              setTagFilter(selectedTag);
            }
          });
        });

        listContainer.appendChild(card);
      });
    }

    function renderFilters() {
      filterContainer.innerHTML = '';

      // タグの集計
      const tagCounts = {};
      worksData.forEach(work => {
        work.tags.forEach(tag => {
          tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
      });

      // 固定表示順を定義し、残りはアルファベット順
      const preferredOrder = ['All', '個人制作', 'チーム制作', '実績', '1week', '2days'];
      const otherTags = Object.keys(tagCounts).filter(t => !preferredOrder.includes(t)).sort();
      const allTags = ['All', ...preferredOrder.filter(t => t !== 'All' && tagCounts[t]), ...otherTags];

      allTags.forEach(tag => {
        const count = tag === 'All' ? worksData.length : (tagCounts[tag] || 0);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `works-filter-btn ${tag === currentFilter ? 'active' : ''}`;
        btn.innerHTML = `${tag} <span class="works-filter-count">(${count})</span>`;

        btn.addEventListener('click', () => {
          setTagFilter(tag);
        });

        filterContainer.appendChild(btn);
      });
    }

    // 検索入力イベントハンドラ
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchClearBtn) {
          searchClearBtn.style.display = searchQuery ? 'block' : 'none';
        }
        renderWorks();
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          searchInput.value = '';
          searchQuery = '';
          if (searchClearBtn) searchClearBtn.style.display = 'none';
          renderWorks();
        }
      });
    }

    if (searchClearBtn) {
      searchClearBtn.addEventListener('click', () => {
        if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
        }
        searchQuery = '';
        searchClearBtn.style.display = 'none';
        renderWorks();
      });
    }

    // 初期化描画
    renderFilters();
    renderWorks();
  </script>

  <script src="/js/hamburger.js"></script>

</body>

</html>
